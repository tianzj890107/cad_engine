<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户与权限 · AI 工艺平台</title><link rel="stylesheet" href="auth.css?v=auth1"><link rel="stylesheet" href="account.css?v=account1"></head><body><main class="account-page"><header class="account-header"><a class="account-brand" href="home.html"><span>AI</span> AI 工艺平台</a><button id="logoutBtn" class="account-secondary" type="button">退出登录</button></header><section class="account-card"><h1>账户设置</h1><p class="account-sub" id="accountSummary">加载中…</p><form id="profileForm" class="account-form"><label>显示名<input id="displayName" maxlength="60" required></label><label>当前密码（仅修改密码时填写）<input id="currentPassword" type="password" autocomplete="current-password"></label><label>新密码（至少 8 位，可留空）<input id="newPassword" type="password" minlength="8" autocomplete="new-password"></label><button class="auth-submit" type="submit">保存个人资料</button></form><p id="accountMessage" class="account-message"></p></section><section id="userAdmin" class="account-card" hidden><div class="account-title-row"><div><h2>用户与权限</h2><p class="account-sub">注册用户先为只读；由管理员授予企业角色。</p></div><button id="reloadUsers" class="account-secondary" type="button">刷新</button></div><div class="account-table-wrap"><table class="account-table"><thead><tr><th>用户</th><th>当前角色</th><th>申请角色</th><th>调整为</th><th></th></tr></thead><tbody id="userRows"></tbody></table></div></section></main><script src="account.js?v=account2"></script></body></html>
