<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · AI 工艺平台</title><link rel="stylesheet" href="auth.css?v=auth1"></head><body><main class="auth-shell"><div class="auth-brand"><span class="auth-brand-mark">AI</span><span>AI 工艺平台</span></div><div class="auth-tabs"><button class="auth-tab active" type="button" data-tab="login">登录</button><button class="auth-tab" type="button" data-tab="register">注册</button></div><form class="auth-form" id="loginForm"><div class="auth-field"><label for="loginUsername">用户名</label><input id="loginUsername" autocomplete="username" required></div><div class="auth-field"><label for="loginPassword">密码</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="auth-submit" type="submit">登录并进入平台</button></form><form class="auth-form" id="registerForm" hidden><div class="auth-field"><label for="registerName">姓名 / 显示名</label><input id="registerName" maxlength="60" placeholder="例如：张工" required></div><div class="auth-field"><label for="registerUsername">用户名</label><input id="registerUsername" maxlength="40" placeholder="3–40 位字母、数字或 _.-" autocomplete="username" required></div><div class="auth-field"><label for="registerPassword">密码</label><input id="registerPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="auth-field"><label for="registerRole">申请角色</label><select id="registerRole"><option value="engineer">工艺工程师</option><option value="sales_manager">销售经理</option><option value="process_manager">工艺技术经理</option><option value="process_director">工艺技术总监</option><option value="sales_director">销售总监</option><option value="finance_manager">财务负责人</option><option value="general_manager">总经理/董事长</option><option value="viewer">只读用户</option></select></div><p class="auth-help">注册后默认只读；系统管理员审核并授予对应业务角色。</p><button class="auth-submit" type="submit">提交注册申请</button></form><div id="authMessage" class="auth-message" role="alert"></div><a class="auth-back" href="home.html">← 返回首页</a></main><script src="auth.js?v=auth1"></script></body></html>
