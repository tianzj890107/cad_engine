<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工艺拆解 · 硕磐智能图纸解析与生成</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>工艺拆解</h1>
    <span class="subtitle">零件 → 结构化工艺路线(工序 / 设备 / 工装 / 刀具 / 参数 / 工时 / 依赖)· 可校验/可编辑/可追溯</span>
    <span id="health" class="health"></span>
  </header>

  <main class="proc-main">
    <a class="proc-back" id="backLink" href="index.html">← 返回工作台</a>

    <div class="proc-head">
      <span class="pid" id="partId"></span>
      <h2 id="partName">加载中…</h2>
      <span class="pmat" id="partMat"></span>
    </div>

    <div class="panel-card extra-input">
      <div class="card-h">附加信息(可选,用于生成 / 重新生成)</div>
      <textarea id="extraNote" rows="2"
        placeholder="补充工艺相关说明,如:材料按45钢调质、批量500、关键面Ra1.6、需做去应力退火…"></textarea>
      <input type="file" id="extraFiles" multiple
        accept="image/*,.txt,.md,.csv,.json,.pdf,.yaml,.yml" />
    </div>

    <div id="status" class="status"></div>
    <div id="planArea"></div>
  </main>

  <!-- 固定在底部的小尺寸操作条 -->
  <div class="proc-actions">
    <button id="btnGen" class="act-sm">⚙️ 生成工艺拆解</button>
    <button id="btnEdit" class="act-sm" disabled>✏️ 编辑</button>
    <button id="btnSave" class="act-sm save" style="display:none">💾 保存</button>
  </div>

  <script type="module" src="process.js"></script>
</body>
</html>
