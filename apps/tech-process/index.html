      }

      // ===================== 商务及谈判策略(报价流程第 3 步,真实接口) =====================
      function emptyNegotiation(pid) {
        return {
          project_id: pid, terms: [], strategies: [], summary: null,
          confirmed: false, timing: { status: 'not_started', completed: false }, search_sources: [],
        };
      }

      function NegotiationStep() {
        const [projects, setProjects] = useState([]);
        const [projectId, setProjectId] = useState(() => {
          try { return localStorage.getItem('techprocess:projectId') || ''; } catch (e) { return ''; }
        });
        const [doc, setDoc] = useState(null);
        const [loading, setLoading] = useState(false);
        const [busy, setBusy] = useState('');

        useEffect(() => {
          api('/api/projects')
            .then((d) => setProjects(Array.isArray(d) ? d : (d.projects || [])))
            .catch((e) => message.error('加载项目失败: ' + e.message));
        }, []);

        const loadDoc = (pid) => {
          if (!pid) { setDoc(null); return; }
          setLoading(true);
          api(`/api/projects/${pid}/negotiation`)
            .then((d) => setDoc(d.negotiation || emptyNegotiation(pid)))
            .catch((e) => message.error('加载失败: ' + e.message))
            .finally(() => setLoading(false));
        };
        useEffect(() => { loadDoc(projectId); }, [projectId]);

        const onPickProject = (pid) => {
          setProjectId(pid);
          try { localStorage.setItem('techprocess:projectId', pid); } catch (e) {}
        };

        const pollTask = (pid, taskId) => new Promise((resolve, reject) => {
          const tick = () => api(`/api/projects/${pid}/tasks/${taskId}`).then((rec) => {
            if (rec.status === 'succeeded') resolve(rec.result);
            else if (rec.status === 'failed') reject(new Error(rec.error || '任务失败'));
            else setTimeout(tick, 1500);
          }).catch(reject);
          tick();
        });

        const doRecommend = () => {
          if (!projectId) return;
          setBusy('recommend');
          api(`/api/projects/${projectId}/negotiation/recommend`, { method: 'POST' })
            .then((d) => pollTask(projectId, d.task_id))
            .then((r) => { setDoc(r.negotiation); message.success('AI 策略生成完成'); })
            .catch((e) => message.error('生成失败: ' + e.message))
            .finally(() => setBusy(''));
        };

        const confirm = () => api(`/api/projects/${projectId}/negotiation/confirm`, { method: 'POST' })
          .then((d) => { setDoc(d.negotiation); message.success('已确认'); }).catch((e) => message.error(e.message));

        const setTiming = (action) => api(`/api/projects/${projectId}/negotiation/timing?action=${action}`, { method: 'POST' })
          .then((d) => { setDoc(d.negotiation); }).catch((e) => message.error(e.message));

        const projOptions = projects.map((p) => ({
          value: p.project_id,
          label: `${p.device_name || p.source_filename || p.project_id}(${p.project_id})`,
        }));

        if (!projectId) {
          return (
            <div style={{ padding: '8px 0' }}>
              <Space wrap style={{ marginBottom: 16 }}>
                <span>关联图纸项目:</span>
                <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                  placeholder="选择图纸项目"
                  value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              </Space>
              <Alert type="info" showIcon message="请先选择一个图纸项目"
                description="商务策略参考该项目的定价结果。建议先完成「定价方案制定」。" />
            </div>
          );
        }

        const d = doc || {};
        const tm = d.timing || {};

        const card = (title, extra, children) => (
          <div style={{ border: '1px solid #eceff2', borderRadius: 6, padding: '14px 18px', marginBottom: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 12 }}>
              <div style={{ fontWeight: 600, fontSize: 15 }}>{title}</div>
              <div style={{ marginLeft: 'auto' }}>{extra}</div>
            </div>
            {children}
          </div>
        );

        const termCols = [
          { title: '条款', dataIndex: 'category', width: 120 },
          { title: '我方主张', dataIndex: 'clause' },
          { title: '底线', dataIndex: 'bottom_line' },
          { title: '可让步空间', dataIndex: 'concession' },
        ];
        const stratCols = [
          { title: '客户类型', dataIndex: 'customer_type', width: 100 },
          { title: '谈判策略', dataIndex: 'strategy' },
          { title: '授权权限', dataIndex: 'authorization', width: 220 },
        ];

        const dur = (() => {
          if (!tm.started_at || !tm.finished_at) return null;
          const s = Date.parse(tm.started_at.replace(/-/g, '/'));
          const f = Date.parse(tm.finished_at.replace(/-/g, '/'));
          if (isNaN(s) || isNaN(f)) return null;
          return Math.max(0, Math.round((f - s) / 60000)) + ' 分钟';
        })();

        return (
          <Spin spinning={loading}>
            <Space wrap style={{ marginBottom: 16 }}>
              <span>关联图纸项目:</span>
              <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                placeholder="选择图纸项目"
                value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              <Button icon={<RobotOutlined />} loading={busy === 'recommend'} onClick={doRecommend}>AI 生成策略</Button>
              {d.confirmed && <Tag color="success"><CheckCircleOutlined /> 已确认 {d.confirmed_at}</Tag>}
              <Button type="primary" disabled={!((d.terms && d.terms.length) || (d.strategies && d.strategies.length))}
                onClick={confirm}>确认</Button>
            </Space>

            {/* ① 商务条款 */}
            {card('① 商务条款(价格/交付/付款/质量保证/知识产权/违约责任)', null,
              (d.terms && d.terms.length) ? (
                <Table size="small" rowKey={(r, i) => 'tm' + i} columns={termCols} dataSource={d.terms} pagination={false} />
              ) : <Empty description="点「AI 生成策略」生成六类条款" image={Empty.PRESENTED_IMAGE_SIMPLE} />
            )}

            {/* ② 分客户类型策略 */}
            {card('② 差异化谈判策略与授权(战略客户 / 新客户 / 海外客户)', null,
              (d.strategies && d.strategies.length) ? (
                <Table size="small" rowKey={(r, i) => 'st' + i} columns={stratCols} dataSource={d.strategies} pagination={false} />
              ) : <Empty description="待 AI 生成" image={Empty.PRESENTED_IMAGE_SIMPLE} />
            )}

            {d.summary && <div style={{ color: '#646a73', margin: '4px 0 16px' }}>商务思路:{d.summary}</div>}

            {/* 时间状态 */}
            {card('执行时间与完成状态',
              <Tag color={tm.status === 'done' ? 'success' : tm.status === 'in_progress' ? 'processing' : 'default'}>
                {tm.status === 'done' ? '已完成' : tm.status === 'in_progress' ? '进行中' : '未开始'}
              </Tag>,
              <div>
                <Descriptions size="small" column={3} bordered>
                  <Descriptions.Item label="开始时间">{tm.started_at || '—'}</Descriptions.Item>
                  <Descriptions.Item label="完成时间">{tm.finished_at || '—'}</Descriptions.Item>
                  <Descriptions.Item label="用时">{dur || '—'}</Descriptions.Item>
                </Descriptions>
                <Space style={{ marginTop: 12 }}>
                  <Button onClick={() => setTiming('start')} disabled={tm.status === 'in_progress'}>开始</Button>
                  <Button type="primary" onClick={() => setTiming('finish')} disabled={tm.completed}>标记完成</Button>
                </Space>
              </div>
            )}

            {(d.search_sources && d.search_sources.length) ? (
              <div style={{ color: '#8a9099', fontSize: 12 }}>
                检索来源:{d.search_sources.map((s, i) => (
                  <a key={i} href={s.url} target="_blank" rel="noopener noreferrer" style={{ marginRight: 10 }}>{s.title}↗</a>
                ))}
              </div>
            ) : null}
          </Spin>
        );
      }

      // ===================== 价格协商及谈判(报价流程第 4 步,真实接口) =====================
      function emptyPriceNego(pid) {
        return {
          project_id: pid, initial_quote: { currency: 'CNY' }, rounds: [], tiered_prices: [],
          price_linkage: {}, special_terms: [], agreed_price: null, summary: null,
          confirmed: false, timing: { status: 'not_started', completed: false }, search_sources: [],
        };
      }

      function PriceNegotiationStep() {
        const [projects, setProjects] = useState([]);
        const [projectId, setProjectId] = useState(() => {
          try { return localStorage.getItem('techprocess:projectId') || ''; } catch (e) { return ''; }
        });
        const [doc, setDoc] = useState(null);
        const [loading, setLoading] = useState(false);
        const [busy, setBusy] = useState('');
        const [nr, setNr] = useState({}); // 新一轮协商录入

        useEffect(() => {
          api('/api/projects')
            .then((d) => setProjects(Array.isArray(d) ? d : (d.projects || [])))
            .catch((e) => message.error('加载项目失败: ' + e.message));
        }, []);

        const loadDoc = (pid) => {
          if (!pid) { setDoc(null); return; }
          setLoading(true);
          api(`/api/projects/${pid}/pricenego`)
            .then((d) => setDoc(d.pricenego || emptyPriceNego(pid)))
            .catch((e) => message.error('加载失败: ' + e.message))
            .finally(() => setLoading(false));
        };
        useEffect(() => { loadDoc(projectId); }, [projectId]);

        const onPickProject = (pid) => {
          setProjectId(pid);
          try { localStorage.setItem('techprocess:projectId', pid); } catch (e) {}
        };

        const pollTask = (pid, taskId) => new Promise((resolve, reject) => {
          const tick = () => api(`/api/projects/${pid}/tasks/${taskId}`).then((rec) => {
            if (rec.status === 'succeeded') resolve(rec.result);
            else if (rec.status === 'failed') reject(new Error(rec.error || '任务失败'));
            else setTimeout(tick, 1500);
          }).catch(reject);
          tick();
        });

        const persist = (next) => api(`/api/projects/${projectId}/pricenego`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(next),
        }).then((d) => setDoc(d.pricenego));

        const doRecommend = () => {
          if (!projectId) return;
          setBusy('recommend');
          api(`/api/projects/${projectId}/pricenego/recommend`, { method: 'POST' })
            .then((d) => pollTask(projectId, d.task_id))
            .then((r) => { setDoc(r.pricenego); message.success('AI 报价材料生成完成'); })
            .catch((e) => message.error('生成失败: ' + e.message))
            .finally(() => setBusy(''));
        };

        const save = () => persist(doc).then(() => message.success('已保存')).catch((e) => message.error(e.message));

        const addRound = () => {
          if (!nr.customer_feedback && !nr.our_response) { message.warning('请填写客户反馈或我方应对'); return; }
          const rounds = [...(doc.rounds || []), {
            round_no: (doc.rounds || []).length + 1,
            date: new Date().toISOString().slice(0, 10),
            customer_feedback: nr.customer_feedback || '', our_response: nr.our_response || '',
            adjusted_price: nr.adjusted_price ?? null, conditions: nr.conditions || '',
          }];
          const next = { ...doc, rounds };
          setDoc(next); setNr({});
          persist(next).then(() => message.success('已添加协商记录')).catch((e) => message.error(e.message));
        };

        const confirm = () => api(`/api/projects/${projectId}/pricenego/confirm`, { method: 'POST' })
          .then((d) => { setDoc(d.pricenego); message.success('已确认'); }).catch((e) => message.error(e.message));

        const setTiming = (action) => api(`/api/projects/${projectId}/pricenego/timing?action=${action}`, { method: 'POST' })
          .then((d) => { setDoc(d.pricenego); }).catch((e) => message.error(e.message));

        const projOptions = projects.map((p) => ({
          value: p.project_id,
          label: `${p.device_name || p.source_filename || p.project_id}(${p.project_id})`,
        }));

        if (!projectId) {
          return (
            <div style={{ padding: '8px 0' }}>
              <Space wrap style={{ marginBottom: 16 }}>
                <span>关联图纸项目:</span>
                <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                  placeholder="选择图纸项目"
                  value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              </Space>
              <Alert type="info" showIcon message="请先选择一个图纸项目"
                description="价格协商基于该项目的定价方案与商务条款。建议先完成前序步骤。" />
            </div>
          );
        }

        const d = doc || {};
        const iq = d.initial_quote || {};
        const pl = d.price_linkage || {};
        const tm = d.timing || {};
        const setIQ = (k, v) => setDoc({ ...d, initial_quote: { ...iq, [k]: v } });
        const setPL = (k, v) => setDoc({ ...d, price_linkage: { ...pl, [k]: v } });

        const card = (title, extra, children) => (
          <div style={{ border: '1px solid #eceff2', borderRadius: 6, padding: '14px 18px', marginBottom: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 12 }}>
              <div style={{ fontWeight: 600, fontSize: 15 }}>{title}</div>
              <div style={{ marginLeft: 'auto' }}>{extra}</div>
            </div>
            {children}
          </div>
        );

        const roundCols = [
          { title: '轮次', dataIndex: 'round_no', width: 60 },
          { title: '日期', dataIndex: 'date', width: 110 },
          { title: '客户反馈', dataIndex: 'customer_feedback' },
          { title: '我方应对', dataIndex: 'our_response' },
          { title: '调整价', dataIndex: 'adjusted_price', width: 90 },
          { title: '附加条件', dataIndex: 'conditions' },
        ];
        const tierCols = [
          { title: '数量下限', dataIndex: 'min_qty', width: 90 },
          { title: '数量上限', dataIndex: 'max_qty', width: 90 },
          { title: '单价(元)', dataIndex: 'unit_price', width: 90 },
          { title: '折扣', dataIndex: 'discount', width: 90 },
          { title: '备注', dataIndex: 'note' },
        ];
        const stCols = [
          { title: '条款', dataIndex: 'item', width: 110 },
          { title: '我方立场', dataIndex: 'our_position' },
          { title: '客户诉求', dataIndex: 'customer_request' },
          { title: '达成', dataIndex: 'agreed' },
        ];

        const dur = (() => {
          if (!tm.started_at || !tm.finished_at) return null;
          const s = Date.parse(tm.started_at.replace(/-/g, '/'));
          const f = Date.parse(tm.finished_at.replace(/-/g, '/'));
          if (isNaN(s) || isNaN(f)) return null;
          return Math.max(0, Math.round((f - s) / 60000)) + ' 分钟';
        })();

        return (
          <Spin spinning={loading}>
            <Space wrap style={{ marginBottom: 16 }}>
              <span>关联图纸项目:</span>
              <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                placeholder="选择图纸项目"
                value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              <Button icon={<RobotOutlined />} loading={busy === 'recommend'} onClick={doRecommend}>AI 生成报价材料</Button>
              <Button type="primary" onClick={save}>保存</Button>
              {d.confirmed && <Tag color="success"><CheckCircleOutlined /> 已确认 {d.confirmed_at}</Tag>}
              <Button onClick={confirm}>确认达成</Button>
            </Space>

            {/* ① 初步报价单 */}
            {card('① 初步报价单(正式书面报价)', null,
              <Space wrap size="large">
                <span>单价(元):<InputNumber value={iq.price} min={0} style={{ width: 120, marginLeft: 4 }}
                  onChange={(v) => setIQ('price', v)} /></span>
                <span>交付周期:<Input value={iq.delivery_period || ''} style={{ width: 180, marginLeft: 4 }}
                  onChange={(e) => setIQ('delivery_period', e.target.value)} /></span>
                <span>付款条件:<Input value={iq.payment_terms || ''} style={{ width: 220, marginLeft: 4 }}
                  onChange={(e) => setIQ('payment_terms', e.target.value)} /></span>
                <span>有效期:<Input value={iq.valid_until || ''} style={{ width: 140, marginLeft: 4 }}
                  onChange={(e) => setIQ('valid_until', e.target.value)} /></span>
              </Space>
            )}

            {/* ② 价格协商记录 */}
            {card('② 价格协商记录(根据客户反馈调整)',
              <span>最终达成价(元):<InputNumber value={d.agreed_price} min={0} style={{ width: 120, marginLeft: 4 }}
                onChange={(v) => setDoc({ ...d, agreed_price: v })} /></span>,
              <div>
                {(d.rounds && d.rounds.length) ? (
                  <Table size="small" rowKey="round_no" columns={roundCols} dataSource={d.rounds} pagination={false} />
                ) : <Empty description="暂无协商记录,可在下方添加" image={Empty.PRESENTED_IMAGE_SIMPLE} />}
                <div style={{ marginTop: 12, padding: 12, background: '#fafafa', borderRadius: 4 }}>
                  <Space wrap>
                    <Input placeholder="客户反馈" value={nr.customer_feedback || ''} style={{ width: 220 }}
                      onChange={(e) => setNr({ ...nr, customer_feedback: e.target.value })} />
                    <Input placeholder="我方应对" value={nr.our_response || ''} style={{ width: 220 }}
                      onChange={(e) => setNr({ ...nr, our_response: e.target.value })} />
                    <InputNumber placeholder="调整价" value={nr.adjusted_price} min={0} style={{ width: 110 }}
                      onChange={(v) => setNr({ ...nr, adjusted_price: v })} />
                    <Input placeholder="附加条件" value={nr.conditions || ''} style={{ width: 180 }}
                      onChange={(e) => setNr({ ...nr, conditions: e.target.value })} />
                    <Button type="primary" icon={<PlusOutlined />} onClick={addRound}>添加协商记录</Button>
                  </Space>
                </div>
              </div>
            )}

            {/* ③ 阶梯价格 */}
            {card('③ 批量折扣阶梯价格', null,
              (d.tiered_prices && d.tiered_prices.length) ? (
                <Table size="small" rowKey={(r, i) => 'tr' + i} columns={tierCols} dataSource={d.tiered_prices} pagination={false} />
              ) : <Empty description="待 AI 生成阶梯价格" image={Empty.PRESENTED_IMAGE_SIMPLE} />
            )}

            {/* ④ 调价联动机制 */}
            {card('④ 调价机制(与原材料市场联动)', null,
              <div>
                <div style={{ marginBottom: 8 }}>机制:<Input value={pl.mechanism || ''}
                  onChange={(e) => setPL('mechanism', e.target.value)} style={{ marginTop: 4 }} /></div>
                <Space wrap size="large">
                  <span>公式:<Input value={pl.formula || ''} style={{ width: 280, marginLeft: 4 }}
                    onChange={(e) => setPL('formula', e.target.value)} /></span>
                  <span>触发:<Input value={pl.trigger || ''} style={{ width: 180, marginLeft: 4 }}
                    onChange={(e) => setPL('trigger', e.target.value)} /></span>
                  <span>复核周期:<Input value={pl.review_cycle || ''} style={{ width: 120, marginLeft: 4 }}
                    onChange={(e) => setPL('review_cycle', e.target.value)} /></span>
                </Space>
              </div>
            )}

            {/* ⑤ 特殊条款 */}
            {card('⑤ 特殊条款谈判(交付/质保/技术支持等非价格条款)', null,
              (d.special_terms && d.special_terms.length) ? (
                <Table size="small" rowKey={(r, i) => 'sp' + i} columns={stCols} dataSource={d.special_terms} pagination={false} />
              ) : <Empty description="待 AI 生成" image={Empty.PRESENTED_IMAGE_SIMPLE} />
            )}

            {d.summary && <div style={{ color: '#646a73', margin: '4px 0 16px' }}>协商策略:{d.summary}</div>}

            {/* 时间状态 */}
            {card('执行时间与完成状态',
              <Tag color={tm.status === 'done' ? 'success' : tm.status === 'in_progress' ? 'processing' : 'default'}>
                {tm.status === 'done' ? '已完成' : tm.status === 'in_progress' ? '进行中' : '未开始'}
              </Tag>,
              <Space>
                <Button onClick={() => setTiming('start')} disabled={tm.status === 'in_progress'}>开始</Button>
                <Button type="primary" onClick={() => setTiming('finish')} disabled={tm.completed}>标记完成</Button>
              </Space>
            )}

            {(d.search_sources && d.search_sources.length) ? (
              <div style={{ color: '#8a9099', fontSize: 12, marginTop: 8 }}>
                检索来源:{d.search_sources.map((s, i) => (
                  <a key={i} href={s.url} target="_blank" rel="noopener noreferrer" style={{ marginRight: 10 }}>{s.title}↗</a>
                ))}
              </div>
            ) : null}
          </Spin>
        );
      }

      // ===================== 报价审批与决策(报价流程第 5 步,真实接口) =====================
      const APPROVAL_LEVELS = {
        1: '级别1 · 销售总监审核(常规订单,符合标准定价区间)',
        2: '级别2 · 销售总监 + 财务负责人联合审核(非常规定价:大幅让利/特殊付款)',
        3: '级别3 · 总经理/董事长审批(重大订单/战略客户/超权限定价)',
      };
      // 可选审批人(供勾选发送审批流)；LEVEL_ROLES_F 用于按 AI 研判级别预勾选
      const APPROVER_ROLES = ['销售总监', '财务负责人', '总经理/董事长'];
      const LEVEL_ROLES_F = { 1: ['销售总监'], 2: ['销售总监', '财务负责人'], 3: ['销售总监', '财务负责人', '总经理/董事长'] };

      function ApprovalStep() {
        const [projects, setProjects] = useState([]);
        const [projectId, setProjectId] = useState(() => {
          try { return localStorage.getItem('techprocess:projectId') || ''; } catch (e) { return ''; }
        });
        const [doc, setDoc] = useState(null);
        const [loading, setLoading] = useState(false);
        const [busy, setBusy] = useState('');
        const [comment, setComment] = useState('');
        const [sendTo, setSendTo] = useState([]);   // 勾选的审批人

        useEffect(() => {
          api('/api/projects')
            .then((d) => setProjects(Array.isArray(d) ? d : (d.projects || [])))
            .catch((e) => message.error('加载项目失败: ' + e.message));
        }, []);
        // doc 变化时同步勾选：优先已送审批人，否则按 AI 研判级别预勾选
        useEffect(() => {
          setSendTo((doc && doc.approvers && doc.approvers.length)
            ? doc.approvers
            : (doc && doc.level ? (LEVEL_ROLES_F[doc.level] || []) : []));
        }, [doc]);

        const loadDoc = (pid) => {
          if (!pid) { setDoc(null); return; }
          setLoading(true);
          api(`/api/projects/${pid}/approval`)
            .then((d) => setDoc(d.approval || null))
            .catch((e) => message.error('加载失败: ' + e.message))
            .finally(() => setLoading(false));
        };
        useEffect(() => { loadDoc(projectId); }, [projectId]);

        const onPickProject = (pid) => {
          setProjectId(pid);
          try { localStorage.setItem('techprocess:projectId', pid); } catch (e) {}
        };

        const pollTask = (pid, taskId) => new Promise((resolve, reject) => {
          const tick = () => api(`/api/projects/${pid}/tasks/${taskId}`).then((rec) => {
            if (rec.status === 'succeeded') resolve(rec.result);
            else if (rec.status === 'failed') reject(new Error(rec.error || '任务失败'));
            else setTimeout(tick, 1500);
          }).catch(reject);
          tick();
        });

        const doRecommend = () => {
          if (!projectId) return;
          setBusy('recommend');
          api(`/api/projects/${projectId}/approval/recommend`, { method: 'POST' })
            .then((d) => pollTask(projectId, d.task_id))
            .then((r) => { setDoc(r.approval); message.success('AI 研判完成'); })
            .catch((e) => message.error('研判失败: ' + e.message))
            .finally(() => setBusy(''));
        };

        const setLevel = (level) => api(`/api/projects/${projectId}/approval/level?level=${level}`, { method: 'POST' })
          .then((d) => { setDoc(d.approval); message.success('已设为' + APPROVAL_LEVELS[level].split('·')[0]); }).catch((e) => message.error(e.message));
        const submit = () => api(`/api/projects/${projectId}/approval/submit`, { method: 'POST' })
          .then((d) => { setDoc(d.approval); message.success('已提交审批'); }).catch((e) => message.error(e.message));
        // 选择审批人并发送审批流（标记审批中、记录送审人；不在本表单做通过/驳回）
        const sendApproval = () => {
          if (!sendTo.length) { message.warning('请至少勾选一位审批人'); return; }
          api(`/api/projects/${projectId}/approval/send`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ approvers: sendTo, comment }),
          }).then((d) => { setDoc(d.approval); setComment(''); message.success('审批流已发送'); })
            .catch((e) => message.error('发送失败: ' + e.message));
        };
        const act = (decision) => api(`/api/projects/${projectId}/approval/act`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ decision, comment }),
        }).then((d) => { setDoc(d.approval); setComment(''); message.success(decision === 'approve' ? '已通过' : '已驳回'); })
          .catch((e) => message.error(e.message));
        const setTiming = (action) => api(`/api/projects/${projectId}/approval/timing?action=${action}`, { method: 'POST' })
          .then((d) => { setDoc(d.approval); }).catch((e) => message.error(e.message));

        const projOptions = projects.map((p) => ({
          value: p.project_id,
          label: `${p.device_name || p.source_filename || p.project_id}(${p.project_id})`,
        }));

        if (!projectId) {
          return (
            <div style={{ padding: '8px 0' }}>
              <Space wrap style={{ marginBottom: 16 }}>
                <span>关联图纸项目:</span>
                <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                  placeholder="选择图纸项目"
                  value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              </Space>
              <Alert type="info" showIcon message="请先选择一个图纸项目"
                description="审批级别依据该项目的定价方案与价格协商结果研判。建议先完成前序步骤。" />
            </div>
          );
        }

        const d = doc || {};
        const cls = d.classification || {};
        const tm = d.timing || {};
        const chain = d.chain || [];
        const curIdx = chain.findIndex((n) => n.status === 'pending');
        const stepStatusMap = { approved: 'finish', pending: 'process', rejected: 'error', waiting: 'wait' };

        const card = (title, extra, children) => (
          <div style={{ border: '1px solid #eceff2', borderRadius: 6, padding: '14px 18px', marginBottom: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 12 }}>
              <div style={{ fontWeight: 600, fontSize: 15 }}>{title}</div>
              <div style={{ marginLeft: 'auto' }}>{extra}</div>
            </div>
            {children}
          </div>
        );

        const overallTag = {
          draft: <Tag>草稿</Tag>, in_review: <Tag color="processing">审批中</Tag>,
          approved: <Tag color="success">审批通过</Tag>, rejected: <Tag color="error">已驳回</Tag>,
        }[d.status || 'draft'];

        const dur = (() => {
          if (!tm.started_at || !tm.finished_at) return null;
          const s = Date.parse(tm.started_at.replace(/-/g, '/'));
          const f = Date.parse(tm.finished_at.replace(/-/g, '/'));
          if (isNaN(s) || isNaN(f)) return null;
          return Math.max(0, Math.round((f - s) / 60000)) + ' 分钟';
        })();

        return (
          <Spin spinning={loading}>
            <Space wrap style={{ marginBottom: 16 }}>
              <span>关联图纸项目:</span>
              <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                placeholder="选择图纸项目"
                value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              <Button icon={<RobotOutlined />} loading={busy === 'recommend'} onClick={doRecommend}>AI 研判审批级别</Button>
            </Space>

            {!doc ? (
              <Empty description="点「AI 研判审批级别」生成分级审批方案" image={Empty.PRESENTED_IMAGE_SIMPLE} />
            ) : (
              <div>
                {/* AI 研判 · 分级依据（只读参考） */}
                {card('AI 研判 · 分级依据（参考）', <Tag>建议{APPROVAL_LEVELS[d.level] ? APPROVAL_LEVELS[d.level].split('·')[0].trim() : ('级别 ' + d.level)}</Tag>,
                  <div>
                    {d.level_reason && <div style={{ color: '#646a73', marginBottom: 6 }}>定级依据:{d.level_reason}</div>}
                    <Descriptions size="small" column={2} bordered>
                      <Descriptions.Item label="订单规模">{cls.order_scale || '—'}</Descriptions.Item>
                      <Descriptions.Item label="符合标准定价区间">{cls.pricing_standard || '—'}</Descriptions.Item>
                      <Descriptions.Item label="让利幅度">{cls.concession || '—'}</Descriptions.Item>
                      <Descriptions.Item label="特殊付款条件">{cls.payment_special || '—'}</Descriptions.Item>
                      <Descriptions.Item label="客户类型">{cls.customer_type || '—'}</Descriptions.Item>
                      <Descriptions.Item label="是否超权限">{cls.over_authority || '—'}</Descriptions.Item>
                    </Descriptions>
                  </div>
                )}

                {/* 发送审批流（选择审批人，不在本表单做通过/驳回） */}
                {card('发送审批流', overallTag,
                  <div>
                    <div style={{ color: '#646a73', marginBottom: 10 }}>
                      选择审批人并发送审批流，交由对应负责人在各自入口审批；<b>本报价单不进行通过/驳回</b>。
                    </div>
                    <Space wrap style={{ marginBottom: 10 }}>
                      <span>发送给:</span>
                      <Select mode="multiple" style={{ minWidth: 320 }} placeholder="选择审批人(可多选)"
                        value={sendTo} onChange={setSendTo} disabled={d.status === 'in_review'}
                        options={APPROVER_ROLES.map((r) => ({ label: r, value: r }))} />
                      <Input placeholder="送审说明(可选)" value={comment}
                        onChange={(e) => setComment(e.target.value)} style={{ width: 260 }} disabled={d.status === 'in_review'} />
                    </Space>
                    <div style={{ marginBottom: 14 }}>
                      {d.status !== 'in_review'
                        ? <Button type="primary" onClick={sendApproval} disabled={!sendTo.length}>发送审批流</Button>
                        : <Alert type="info" showIcon
                            message={'审批流已发送 · 送审人：' + ((d.approvers || []).join('、') || '—') + (d.sent_at ? (' · ' + d.sent_at) : '')}
                            description="审批人将在各自入口处理，进度见下方。" />}
                    </div>
                    {chain.length > 0 && (
                      <Steps size="small" current={curIdx < 0 ? chain.length : curIdx}
                        status={d.status === 'rejected' ? 'error' : (d.status === 'approved' ? 'finish' : 'process')}>
                        {chain.map((n, i) => (
                          <Step key={i} status={stepStatusMap[n.status] || 'wait'} title={n.role}
                            description={n.status === 'pending' ? '待审批' : (n.approver ? `${n.status === 'approved' ? '通过' : n.status === 'rejected' ? '驳回' : ''} ${n.approver} ${n.at || ''}` : '')} />
                        ))}
                      </Steps>
                    )}
                    {d.status === 'approved' && (
                      <Alert style={{ marginTop: 12 }} type="success" showIcon message="✅ 内部审批通过,可正式报价 / 签约" description={d.decision_note} />
                    )}
                    {d.status === 'rejected' && (
                      <Alert style={{ marginTop: 12 }} type="error" showIcon message={d.decision_note || '已驳回'} />
                    )}
                  </div>
                )}

                {d.summary && <div style={{ color: '#646a73', margin: '4px 0 16px' }}>审批要点:{d.summary}</div>}

                {/* 时间状态 */}
                {card('执行时间与完成状态',
                  <Tag color={tm.status === 'done' ? 'success' : tm.status === 'in_progress' ? 'processing' : 'default'}>
                    {tm.status === 'done' ? '已完成' : tm.status === 'in_progress' ? '进行中' : '未开始'}
                  </Tag>,
                  <Space>
                    <Button onClick={() => setTiming('start')} disabled={tm.status === 'in_progress'}>开始</Button>
                    <Button type="primary" onClick={() => setTiming('finish')} disabled={tm.completed}>标记完成</Button>
                  </Space>
                )}
              </div>
            )}
          </Spin>
        );
      }

      // ===================== 详情页(绑定真实项目) =====================
      function DetailPage({ mode, row, onBack }) {
        // 报告页通过 ?step=1 进入 2.2；其他入口仍默认从 2.1 开始。
        const [current, setCurrent] = useState(() => {
          const requested = Number.parseInt(new URLSearchParams(location.search).get('step'), 10);
          return Number.isInteger(requested) && requested >= 0 && requested < TASK_STEPS.length ? requested : 0;
        });
        const projectId = (row && row.project_id) || INITIAL_PROJECT_ID || '';
        const drawingUrl = projectId
          ? `${PROCESS_DRAWING_URL}${PROCESS_DRAWING_URL.includes('?') ? '&' : '?'}project=${encodeURIComponent(projectId)}`
          : PROCESS_DRAWING_URL;
        useEffect(() => { if (projectId) rememberProject(projectId); }, [projectId]);
        // 首页再次打开该项目时，恢复到用户上次停留的 2.1–2.6 步骤。
        useEffect(() => {
          if (!projectId || BIZ !== 'tech') return;
          const url = `/apps/tech-process/?biz=tech&project=${encodeURIComponent(projectId)}&step=${current}`;
          try { localStorage.setItem(`cad_engine:last_page:${projectId}`, url); } catch (_) {}
        }, [projectId, current]);

        // 每个进度步骤对应的内容:
        //  - 「图纸解析与设计工艺转化」步骤:直接内嵌 process_drawing(需单独运行);
          //  - 首个步骤:真实项目概览;
        //  - 其余步骤:占位。
        const stepContent = (i, name) => {
          if (CFG.materialStep && name === CFG.materialStep) {
            return <MaterialStep />;
          }
          if (CFG.manufacturingStep && name === CFG.manufacturingStep) {
            return <ManufacturingStep />;
          }
          if (CFG.cleaningStep && name === CFG.cleaningStep) {
            return <CleaningStep />;
          }
          if (CFG.assemblyStep && name === CFG.assemblyStep) {
            return <AssemblyStep />;
          }
          if (CFG.productionStep && name === CFG.productionStep) {
            return <ProductionStep />;
          }
          if (CFG.summaryStep && name === CFG.summaryStep) {
            return <SummaryStep />;
          }
          if (CFG.costStep && name === CFG.costStep) {
            return <CostEstimateStep />;
          }
          if (CFG.pricingStep && name === CFG.pricingStep) {
            return <PricingStep />;
          }
          if (CFG.negotiationStep && name === CFG.negotiationStep) {
            return <NegotiationStep />;
          }
          if (CFG.priceNegoStep && name === CFG.priceNegoStep) {
            return <PriceNegotiationStep />;
          }
          if (CFG.approvalStep && name === CFG.approvalStep) {
            return <ApprovalStep />;
          }
          if (CFG.endStep && name === CFG.endStep) {
            return <EndStep />;
          }
          if (CFG.drawingStep && name === CFG.drawingStep) {
            return (
              <div style={{ padding: '8px 0' }}>
                <div className="tp-section-title">{name}</div>
                <ProjectOverview projectId={projectId} />
                <Divider />
                <div style={{ marginBottom: 8, color: '#8a9099', fontSize: 12 }}>
                  本步骤直接嵌入同一服务中的图纸工作台，并带入当前项目。
                  <a
                    href={drawingUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    style={{ marginLeft: 8 }}
                  >
                    新窗口打开 ↗
                  </a>
                </div>
                <iframe
                  title={name}
                  src={drawingUrl}
                  style={{
                    width: '100%',
                    height: '70vh',
                    border: '1px solid #eceff2',
                    borderRadius: 4,
                  }}
                  allow="clipboard-write; clipboard-read"
                />
              </div>
            );
          }
          return (
            <div style={{ padding: '24px 0' }}>
              <div className="tp-section-title">{name}</div>
              <div style={{ color: '#8a9099' }}>「{name}」内容待接入。</div>
            </div>
          );
        };
        const processSubCurrent = current < 6 ? current : -1;
        const processSubsteps = ['2.1 图纸解析', '2.2 材料定性', '2.3 工艺路径', '2.4 洁净管控', '2.5 组装检测', '2.6 产能评估'];
        const outputUrl = projectId ? `/summary.html?project=${encodeURIComponent(projectId)}` : '/summary.html';

        return (
          <div className="tp-page">
            {BIZ === 'tech' && (
              <div className="tp-top-workflow" aria-label="工艺评估主流程">
                <div className="tp-flow-wrapper"><div className="tp-flow-step done"><b>1</b><span>接受工艺评估需求</span></div></div>
                <i className="tp-flow-line done"></i>
                <div className="tp-flow-wrapper"><div className="tp-flow-step active"><b>2</b><span>解析技术工艺过程</span></div><div className="tp-flow-substeps">{processSubsteps.map((step, index) => <React.Fragment key={step}><span className={`tp-flow-substep ${index < processSubCurrent || processSubCurrent === -1 ? 'done' : index === processSubCurrent ? 'active' : ''}`}>{step}</span>{index < processSubsteps.length - 1 && <span className="tp-flow-subarrow">→</span>}</React.Fragment>)}</div></div>
                <i className="tp-flow-line"></i>
                <div className="tp-flow-wrapper"><div className="tp-flow-step"><b>3</b><span>输出工艺评估结果</span></div></div>
              </div>
            )}
            <div className="tp-card">
              <div className="tp-detail-title">
                {row && row.name ? row.name : CFG.pageTitle}
              </div>

              {/* 单一任务进度条：点击节点切换内容，避免与顶部 Tab 重复。 */}
              <div className="tp-section-title">任务进度</div>
              <Steps
                current={current}
                onChange={setCurrent}
                labelPlacement="vertical"
                size="small"
                style={{ margin: '8px 0 28px' }}
              >
                {TASK_STEPS.map((t, i) => (
                  <Step
                    key={t}
                    title={t}
                    icon={
                      i === 0 ? (
                        <PlayCircleOutlined />
                      ) : i === TASK_STEPS.length - 1 ? (
                        <AimOutlined />
                      ) : (
                        <AppstoreOutlined />
                      )
                    }
                  />
                ))}
              </Steps>

              {/* 当前步骤的内容,随步骤切换 */}
              <div style={{ minHeight: 220 }}>{stepContent(current, TASK_STEPS[current])}</div>

              <div className="tp-detail-footer">
                <Button onClick={onBack}>← 回到上一步</Button>
                {projectId && BIZ === 'tech' && current === TASK_STEPS.length - 1
                  ? <Button type="primary" href={outputUrl}>输出工艺评估结果</Button>
                  : projectId && <Button type="primary" href={drawingUrl}>打开图纸工作台</Button>}
              </div>
            </div>
          </div>
        );
      }

      // ===================== 应用入口 =====================
      function App() {
        const [view, setView] = useState(() => INITIAL_PROJECT_ID
          ? { name: 'detail', mode: 'view', row: { project_id: INITIAL_PROJECT_ID } }
          : { name: 'list' });
        return (
          <ConfigProvider>
            {view.name === 'list' ? (
              <ListPage
                onCreate={() => { window.location.href = '/'; }}
                onOpen={(row, mode) => setView({ name: 'detail', mode, row })}
              />
            ) : (
              <DetailPage mode={view.mode} row={view.row} onBack={() => setView({ name: 'list' })} />
            )}
          </ConfigProvider>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
