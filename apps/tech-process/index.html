<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>技术工艺管理</title>
    <!-- antd 4 / React 17 / moment, 与 eimos 主站技术栈一致 -->
    <link rel="stylesheet" href="https://unpkg.com/antd@4.24.15/dist/antd.min.css" />
    <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/moment@2.29.4/min/moment.min.js"></script>
    <script src="https://unpkg.com/antd@4.24.15/dist/antd.min.js"></script>
    <script src="https://unpkg.com/@ant-design/icons@4.8.0/dist/index.umd.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #f0f2f5;
      }
      * {
        box-sizing: border-box;
      }
      .tp-page {
        padding: 16px;
        min-height: 100%;
      }
      .tp-card {
        background: #fff;
        border-radius: 4px;
        padding: 20px 24px;
        position: relative;
      }
      .tp-toolbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 12px;
      }
      .tp-filter {
        display: flex;
        align-items: flex-end;
        gap: 24px;
        margin-bottom: 20px;
      }
      .tp-filter .tp-field {
        flex: 1;
        max-width: 360px;
      }
      .tp-field label {
        display: block;
        color: #1f2329;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .tp-filter-actions {
        display: flex;
        align-items: center;
        gap: 16px;
        white-space: nowrap;
      }
      .tp-link {
        color: #1677ff;
        cursor: pointer;
      }
      .tp-detail-title {
        display: flex;
        align-items: center;
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      .tp-detail-title .anticon {
        margin-right: 10px;
        cursor: pointer;
        color: #1f2329;
      }
      .tp-section-title {
        font-size: 16px;
        font-weight: 600;
        margin: 20px 0 16px;
      }
      .tp-detail-footer {
        position: sticky;
        bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding: 14px 0 4px;
        background: #fff;
      }
      /* 与图纸工作台统一：浅灰页面、白色圆角卡片、蓝色当前步骤。 */
      :root { --tp-blue:#3b82f6; --tp-blue-soft:#eff6ff; --tp-green:#10b981; --tp-line:#e5e7eb; --tp-ink:#1f2937; --tp-muted:#6b7280; }
      html,body,#root { background:#f5f5f5; color:var(--tp-ink); font-family:Inter,"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .tp-page { width:min(1280px,100%); margin:0 auto; padding:20px; }
      .tp-card { padding:24px; border:1px solid var(--tp-line); border-radius:12px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
      .tp-home-link{position:fixed;top:18px;right:20px;z-index:1300;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid #bfdbfe;border-radius:8px;background:#fff;color:var(--tp-blue);font:600 13px/1.2 Inter,"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-decoration:none;box-shadow:0 3px 12px rgba(30,64,175,.1);transition:.15s}.tp-home-link:hover{border-color:var(--tp-blue);background:var(--tp-blue-soft);transform:translateY(-1px)}
      .tp-toolbar { justify-content:space-between; }
      .tp-toolbar::before { content:"AI 工艺 · 项目工作台"; color:var(--tp-ink); font-size:18px; font-weight:700; }
      .tp-filter { padding:14px 16px; background:#fafafa; border:1px solid #f1f5f9; border-radius:10px; }
      .tp-filter .tp-field { max-width:520px; }.tp-field label{color:var(--tp-muted);font-size:12px}.tp-link{color:var(--tp-blue)}
      .tp-detail-title { margin-bottom:20px; color:var(--tp-ink); }.tp-section-title { color:var(--tp-ink); }
      .tp-top-workflow { display:flex; align-items:flex-start; justify-content:center; gap:8px; margin:0 0 20px; padding:16px; background:#fff; border:1px solid var(--tp-line); border-radius:12px; overflow-x:auto; }
      .tp-flow-wrapper{display:flex;min-width:132px;flex:0 0 auto;flex-direction:column;align-items:center}.tp-flow-substeps{display:flex;align-items:center;gap:3px;margin-top:4px;padding-left:26px;white-space:nowrap}.tp-flow-substep{padding:2px 5px;border-radius:4px;color:#9ca3af;font-size:11px}.tp-flow-substep.done{color:var(--tp-green)}.tp-flow-substep.active{background:var(--tp-blue-soft);color:var(--tp-blue);font-weight:600}.tp-flow-subarrow{color:#9ca3af;font-size:10px}
      .tp-flow-line.done{background:var(--tp-green)}
      .tp-flow-step { display:flex; align-items:center; gap:7px; flex:0 0 auto; padding:5px 12px; color:#9ca3af; border-radius:999px; font-size:12px; white-space:nowrap; }.tp-flow-step b{display:grid;width:22px;height:22px;place-items:center;border-radius:50%;background:#f3f4f6;font-size:11px}.tp-flow-step.done{color:var(--tp-green)}.tp-flow-step.done b{color:#fff;background:var(--tp-green)}.tp-flow-step.active{color:var(--tp-blue);background:var(--tp-blue-soft);font-weight:600}.tp-flow-step.active b{color:#fff;background:var(--tp-blue)}.tp-flow-line{width:36px;height:2px;flex:0 0 36px;margin-top:15px;background:var(--tp-line)}.tp-flow-line.done{background:var(--tp-blue)}
      .ant-tabs-nav{margin-bottom:18px!important}.ant-tabs-tab{padding:8px 10px!important;color:var(--tp-muted)}.ant-tabs-tab.ant-tabs-tab-active .ant-tabs-tab-btn{color:var(--tp-blue)!important;font-weight:600}.ant-tabs-ink-bar{background:var(--tp-blue)!important}.ant-steps-item-process .ant-steps-item-icon{background:var(--tp-blue)!important;border-color:var(--tp-blue)!important}.ant-btn-primary{background:var(--tp-blue);border-color:var(--tp-blue);border-radius:8px}.ant-btn{border-radius:8px}.ant-table-wrapper .ant-table{border:1px solid var(--tp-line);border-radius:10px;overflow:hidden}.ant-table-thead>tr>th{background:#fafafa;color:var(--tp-muted);font-size:12px}.ant-alert{border-radius:8px}.ant-card,.ant-modal-content{border-radius:12px}
      @media(max-width:700px){.tp-page{padding:12px}.tp-card{padding:16px}.tp-top-workflow{justify-content:flex-start}.tp-flow-line{width:16px;flex-basis:16px}.tp-filter{display:block}.tp-filter-actions{margin:10px 0 0!important}.tp-home-link{top:10px;right:12px;padding:8px 10px;font-size:12px}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <a class="tp-home-link" href="/home.html" aria-label="返回 AI 工艺平台首页">⌂ AI 工艺平台首页</a>
    <script type="text/babel" data-presets="react">
      const { useState, useEffect } = React;
      const {
        Table, Button, Input, InputNumber, Tag, Pagination, Steps, Form, Radio,
        Select, DatePicker, Row, Col, message, ConfigProvider,
        Modal, Popconfirm, Spin, Space, Alert, Empty, Descriptions, Divider,
      } = antd;
      const {
        PlusOutlined, LeftCircleOutlined, PlayCircleOutlined,
        AppstoreOutlined, AimOutlined, FullscreenOutlined,
        RobotOutlined, CheckCircleOutlined, ReloadOutlined, DeleteOutlined,
      } = icons;
      // 与后端同源:本应用由 process_drawing 服务在 /apps/tech-process/ 提供,/api/* 同源。
      const API = '';
      async function api(path, opts) {
        const token = localStorage.getItem('authToken') || '';
        const request = opts || {};
        const headers = Object.assign({}, request.headers || {});
        if (token && !headers.Authorization && !headers.authorization) {
          headers.Authorization = 'Bearer ' + token;
        }
        const res = await fetch(API + path, Object.assign({}, request, { headers }));
        const text = await res.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch (e) { data = { raw: text }; }
        if (!res.ok) throw new Error(data.detail || data.raw || ('HTTP ' + res.status));
        return data;
      }
      // 浏览器新窗口下载无法添加 Authorization 头，沿用后端支持的 ?token= 透传。
      function resourceUrl(path) {
        const token = localStorage.getItem('authToken') || '';
        return token ? `${path}${path.includes('?') ? '&' : '?'}token=${encodeURIComponent(token)}` : path;
      }
      const { Step } = Steps;
      const { Option } = Select;

      // ----- 列表状态 -----
      const STATUS_COLORS = {
        已定稿: 'success', 已录入: 'processing', 已完成: 'success',
        解析完成: 'processing', 已生成图纸: 'processing', 已生成几何: 'processing',
        已上传: 'default', 未解析: 'default', 审核中: 'warning', 已驳回: 'error',
      };
      // 同一套页面承载两个业务,用 URL 参数 ?biz= 切换文案与流程步骤:
      //   biz=tech (默认) -> 技术工艺管理
      //   biz=quote        -> 商机报价管理
      const BIZ = new URLSearchParams(location.search).get('biz') || 'tech';
      const CONFIGS = {
        tech: {
          pageTitle: '技术工艺管理',
          createBtn: '新增技术工艺',
          editTitle: '技术工艺基本信息',
          codeLabel: '工艺编号',
          nameLabel: '工艺名称',
          // 2.1 直接嵌入 process_drawing(AI 图纸拆解平台);null 表示无嵌入步骤。
          drawingStep: '2.1 图纸解析',
          // 该步骤为「材料定性与供应链拆解」,调用 /api/* 真实数据;null 表示无此步骤。
          materialStep: '2.2 材料定性',
          // 该步骤为「制造工艺路径规划和BOM编制」,调用 /api/* 真实数据。
          manufacturingStep: '2.3 工艺路径',
          // 该步骤为「清洗与洁净度管控方案制定」,调用 /api/* 真实数据。
          cleaningStep: '2.4 洁净管控',
          // 该步骤为「组装与检测方案制定」,调用 /api/* 真实数据。
          assemblyStep: '2.5 组装检测',
          // 该步骤为「产线匹配与产能评估」,调用 /api/* 真实数据。
          productionStep: '2.6 产能评估',
          // 该步骤为「技术工艺总结」,汇总各步 + 可编辑 + 导出文档。
          summaryStep: '技术工艺总结',
          // 最终确认并录入放在「技术工艺总结」页末尾，不再占用独立结束步骤。
          endStep: null,
          costStep: null, // 技术工艺流程无「成本测算」步
          pricingStep: null,
          negotiationStep: null,
          priceNegoStep: null,
          approvalStep: null,
          steps: [
            '2.1 图纸解析',
            '2.2 材料定性',
            '2.3 工艺路径',
            '2.4 洁净管控',
            '2.5 组装检测',
            '2.6 产能评估',
            '技术工艺总结',
          ],
        },
        quote: {
          pageTitle: '商机报价管理',
          createBtn: '新增报价单',
          editTitle: '报价单基本信息',
          codeLabel: '报价编号',
          nameLabel: '报价名称',
          drawingStep: null,
          materialStep: null,
          manufacturingStep: null,
          cleaningStep: null,
          assemblyStep: null,
          productionStep: null,
          summaryStep: null,
          endStep: '结束',
          costStep: '成本测算', // 报价流程第 1 个真实节点
          pricingStep: '定价方案制定', // 报价流程第 2 个节点
          negotiationStep: '商务及谈判策略', // 报价流程第 3 个节点
          priceNegoStep: '价格协商及谈判', // 报价流程第 4 个节点
          approvalStep: '报价审批与决策', // 报价流程第 5 个节点
          steps: [
            '开始',
            '成本测算',
            '定价方案制定',
            '商务及谈判策略',
            '价格协商及谈判',
            '报价审批与决策',
            '结束',
          ],
        },
      };
      const CFG = CONFIGS[BIZ] || CONFIGS.tech;
      document.title = CFG.pageTitle;
      const TASK_STEPS = CFG.steps;

      // process_drawing(AI 图纸拆解平台)的地址。
      // 合并后本应用由 process_drawing 服务在 /apps/tech-process/ 提供,与图纸平台同源,
      // 因此默认用相对地址 '/'(即同一服务的根)。覆盖优先级:
      //   localStorage['techprocess:drawingUrl'] > ?drawingUrl= > 默认 '/'。
      const PROCESS_DRAWING_URL = (function () {
        try {
          const o = localStorage.getItem('techprocess:drawingUrl');
          if (o) return o;
        } catch (e) {}
        return new URLSearchParams(location.search).get('drawingUrl') || '/';
      })();

      // 项目上下文只来自 URL / 已打开的真实项目；各业务步骤共享这一选择。
      const INITIAL_PROJECT_ID = (function () {
        const fromUrl = new URLSearchParams(location.search).get('project');
        if (fromUrl) return fromUrl;
        try { return localStorage.getItem('techprocess:projectId') || ''; } catch (e) { return ''; }
      })();

      function rememberProject(projectId) {
        if (!projectId) return;
        try { localStorage.setItem('techprocess:projectId', projectId); } catch (e) {}
      }

      function projectStage(meta) {
        const stages = (meta && meta.stages) || {};
        if (stages.geometry && stages.drawings) return '已生成图纸';
        if (stages.geometry) return '已生成几何';
        if (stages.parsed) return '解析完成';
        if (stages.uploaded) return '已上传';
        return '未解析';
      }

      if (INITIAL_PROJECT_ID) rememberProject(INITIAL_PROJECT_ID);

      // ===================== 列表页 =====================
      function ListPage({ onCreate, onOpen }) {
        // 只展示真实项目与真实的「结束」记录；不混入任何演示数据。
        const [records, setRecords] = useState([]);
        const [keyword, setKeyword] = useState('');
        useEffect(() => {
          Promise.all([api(`/api/techprocess/records?biz=${BIZ}`), api('/api/projects')])
            .then(([recordData, projectData]) => {
              const finalized = (recordData.records || []).map((r) => ({
                key: 'record-' + r.id, code: r.code || r.project_id, name: r.name,
                owner: r.owner || '—', created: r.updated_at || r.created_at,
                status: r.status || '已录入', editable: true, project_id: r.project_id,
                note: r.note || '', source: 'record',
              }));
              const recordedProjectIds = new Set(finalized.map((r) => r.project_id).filter(Boolean));
              const projects = Array.isArray(projectData) ? projectData : (projectData.projects || []);
              const activeProjects = projects.filter((p) => !recordedProjectIds.has(p.project_id)).map((p) => ({
                key: 'project-' + p.project_id, code: p.project_id,
                name: p.device_name || p.source_filename || '未命名图纸项目', owner: p.owner || '—',
                created: p.created_at, status: projectStage(p), editable: true, project_id: p.project_id,
                note: p.note || '', source: 'project',
              }));
              setRecords([...finalized, ...activeProjects]);
            }).catch((e) => message.error('加载项目列表失败: ' + e.message));
        }, []);

        // 打开记录:若关联了图纸项目,带入 projectId 便于各步加载其数据。
        const openRow = (row, mode) => {
          if (row.project_id) {
            rememberProject(row.project_id);
          }
          onOpen(row, mode);
        };

        const dataSource = records.filter((row) => {
          const q = keyword.trim().toLowerCase();
          if (!q) return true;
          return [row.code, row.name, row.owner, row.status, row.note].some((v) =>
            String(v || '').toLowerCase().includes(q));
        });

        const columns = [
          { title: CFG.codeLabel, dataIndex: 'code', sorter: true, width: 180,
            render: (t, row) => <span className="tp-link" onClick={() => openRow(row, 'view')}>{t}</span> },
          { title: CFG.nameLabel, dataIndex: 'name', sorter: true, ellipsis: true },
          { title: '项目负责人', dataIndex: 'owner', width: 130 },
          { title: '来源', dataIndex: 'source', width: 120,
            render: (s) => <Tag color={s === 'record' ? 'success' : 'processing'}>{s === 'record' ? '已归档记录' : '进行中项目'}</Tag> },
          { title: '创建时间', dataIndex: 'created', sorter: true, width: 170 },
          { title: '状态', dataIndex: 'status', width: 110,
            render: (s) => <Tag color={STATUS_COLORS[s] || 'default'}>{s}</Tag> },
          { title: '操作', dataIndex: 'op', width: 120, fixed: 'right',
            render: (_, row) => (
              <span>
                <a onClick={() => openRow(row, 'view')}>查看</a>
                {row.editable && <a style={{ marginLeft: 12 }} onClick={() => openRow(row, 'edit')}>编辑</a>}
              </span>
            ) },
        ];

        return (
          <div className="tp-page">
            <div className="tp-card">
              <div className="tp-toolbar">
                <Button type="primary" icon={<PlusOutlined />} onClick={onCreate}>
                  {CFG.createBtn}
                </Button>
              </div>

              <div className="tp-filter">
                <div className="tp-field">
                  <label>搜索真实项目</label>
                  <Input value={keyword} onChange={(e) => setKeyword(e.target.value)}
                    placeholder="项目名称、项目编号、负责人或状态" allowClear />
                </div>
                <div className="tp-filter-actions" style={{ marginLeft: 'auto' }}>
                  <Button onClick={() => setKeyword('')}>重置</Button>
                </div>
              </div>

              <Table
                columns={columns}
                dataSource={dataSource}
                pagination={false}
                scroll={{ x: 1200 }}
                size="middle"
              />

              <div style={{ display: 'flex', justifyContent: 'flex-end', alignItems: 'center', marginTop: 16 }}>
                <span style={{ marginRight: 16, color: '#646a73' }}>共 {dataSource.length} 条真实记录</span>
              </div>
            </div>
          </div>
        );
      }

      function ProjectOverview({ projectId }) {
        const [project, setProject] = useState(null);
        const [loading, setLoading] = useState(false);
        useEffect(() => {
          if (!projectId) { setProject(null); return; }
          setLoading(true);
          api(`/api/projects/${projectId}`).then(setProject)
            .catch((e) => message.error('加载项目概览失败: ' + e.message))
            .finally(() => setLoading(false));
        }, [projectId]);

        if (!projectId) {
          return <Alert type="info" showIcon
            message="请先创建或选择一个图纸项目"
            description={<span>现有后端的需求入口是「上传图纸创建项目」。创建后，图纸解析及后续工艺数据都会绑定到该项目。<a href="/" style={{ marginLeft: 8 }}>打开图纸工作台 ↗</a></span>} />;
        }
        const meta = (project && project.meta) || {};
        const ir = (project && project.ir) || {};
        return <Spin spinning={loading}>
          <Alert type="info" showIcon style={{ marginBottom: 16 }}
            message="项目概览"
            description="此页只展示后端已保存的项目资料；需求受理的扩展字段尚无后端模型，因此不会在此伪造可保存表单。" />
          <Descriptions bordered size="small" column={2}>
            <Descriptions.Item label="项目编号">{projectId}</Descriptions.Item>
            <Descriptions.Item label="当前阶段">{projectStage(meta)}</Descriptions.Item>
            <Descriptions.Item label="项目名称">{ir.device_name || meta.source_filename || '—'}</Descriptions.Item>
            <Descriptions.Item label="创建人">{meta.owner || '—'}</Descriptions.Item>
            <Descriptions.Item label="创建时间">{meta.created_at || '—'}</Descriptions.Item>
            <Descriptions.Item label="解析状态">{meta.has_ir || ir.device_name ? '已生成设计意图 IR' : '尚未解析'}</Descriptions.Item>
            <Descriptions.Item label="补充技术说明" span={2}>{meta.note || '—'}</Descriptions.Item>
            <Descriptions.Item label="佐证文件" span={2}>{(meta.attachments || []).join('、') || '无'}</Descriptions.Item>
          </Descriptions>
          <Space style={{ marginTop: 16 }}>
            <Button type="primary" href={`/?project=${encodeURIComponent(projectId)}`}>打开图纸工作台</Button>
            <Button href={resourceUrl(`/api/projects/${projectId}/audit`)} target="_blank">查看审计记录</Button>
          </Space>
        </Spin>;
      }

      // ===================== 供应商目录维护(弹窗) =====================
      function SuppliersModal({ open, onClose }) {
        const [list, setList] = useState([]);
        const [form] = Form.useForm();
        const reload = () => api('/api/suppliers').then((d) => setList(d.suppliers || [])).catch(() => {});
        useEffect(() => { if (open) reload(); }, [open]);

        const add = () => {
          form.validateFields().then((v) => {
            api('/api/suppliers', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(v),
            }).then(() => { form.resetFields(); reload(); message.success('已保存供应商'); })
              .catch((e) => message.error(e.message));
          });
        };
        const del = (id) => api('/api/suppliers/' + id, { method: 'DELETE' })
          .then(reload).catch((e) => message.error(e.message));

        const cols = [
          { title: '供应商', dataIndex: 'name' },
          { title: '可供物料', dataIndex: 'material' },
          { title: '最高纯度%', dataIndex: 'max_purity_pct', width: 90 },
          { title: 'D50 区间µm', render: (_, r) => `${r.d50_min_um ?? '-'} ~ ${r.d50_max_um ?? '-'}`, width: 110 },
          { title: '交期', dataIndex: 'lead_time', width: 90 },

      // ===================== 材料定性与供应链拆解(真实接口) =====================
      function emptyMaterialPlan(pid) {

          project_id: pid,
          body: { candidates: [], selected: null, rationale: null, confirmed: false },
          metallization: { paste: [], layers: [], rationale: null, confirmed: false },
          supply: { requirements: [], matches: [], conclusion: null },
          timing: { status: 'not_started', completed: false },
          search_sources: [],
        };
      }

        const loadPlan = (pid) => {

          }).catch(reject);
          tick();

        const savePlan = (next) => api(`/api/projects/${projectId}/material`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },

        const doRecommend = () => {
          if (!projectId) return;
          setBusy('recommend');
          api(`/api/projects/${projectId}/material/recommend`, { method: 'POST' })

          setBusy('evaluate');

            </div>

        const matchCols = [

          { title: '物料', dataIndex: 'material' },

              <div style={{ marginLeft: 'auto' }}>{extra}</div>
            </div>
            {children}
          </div>

        const dur = (() => {
          if (!tm.started_at || !tm.finished_at) return null;
          const s = Date.parse(tm.started_at.replace(/-/g, '/'));
          const f = Date.parse(tm.finished_at.replace(/-/g, '/'));
          if (isNaN(s) || isNaN(f)) return null;
          const mins = Math.max(0, Math.round((f - s) / 60000));
          return mins + ' 分钟';
        })();

        return (
          <Spin spinning={loading}>
            {header}

            {/* ① 陶瓷主体材料 */}
            {card('① 陶瓷主体材料定性(氧化铝 / 氮化铝 / 其他)',
              <Space>
                {b.confirmed && <Tag color="success"><CheckCircleOutlined /> 已确认 {b.confirmed_at}</Tag>}
                <Button icon={<RobotOutlined />} loading={busy === 'recommend'} onClick={doRecommend}>
                  AI 推荐
                </Button>
              </Space>,
              <div>
                {(b.candidates && b.candidates.length) ? (
                  <Table size="small" rowKey="material" columns={bodyCols} dataSource={b.candidates}

                      onChange: (keys) => setPlan({ ...plan, body: { ...b, selected: keys[0] } }),

                {b.rationale && <div style={{ color: '#646a73', marginTop: 10 }}>推荐理由:{b.rationale}</div>}

                  <div style={{ marginTop: 12 }}>

                      disabled={!b.selected} onClick={() => confirmSection('body')}>确认选用</Button>
                  </div>

              </div>
            )}

            {/* ② 电极浆料与金属化 */}
            {card('② 电极浆料及金属化层配方',
              <Space>
                {m.confirmed && <Tag color="success"><CheckCircleOutlined /> 已确认 {m.confirmed_at}</Tag>}

                  onClick={() => confirmSection('metallization')}>确认方案</Button>

                <div style={{ color: '#8a9099', margin: '12px 0 6px' }}>金属化层结构</div>
                {(m.layers && m.layers.length) ? (

              </div>

            {/* ③ 供应商评估 */}
            {card('③ 供应商能否满足纯度/粒径要求',

                <Button size="small" onClick={() => setSuppliersOpen(true)}>维护供应商目录</Button>

              </Space>,
              <div>
                <div style={{ color: '#8a9099', marginBottom: 6 }}>粉末要求(达标基准)</div>
                {(sup.requirements && sup.requirements.length) ? (
                  <Table size="small" rowKey={(r, i) => 'r' + i} columns={reqCols} dataSource={sup.requirements} pagination={false} />
                ) : <Empty description="先做 AI 推荐生成要求,或在供应商目录中维护后评估" image={Empty.PRESENTED_IMAGE_SIMPLE} />}
                {(sup.matches && sup.matches.length) ? (
                  <div style={{ marginTop: 12 }}>
                    <div style={{ color: '#8a9099', marginBottom: 6 }}>匹配结果</div>
                    <Table size="small" rowKey={(r, i) => 'm' + i} columns={matchCols} dataSource={sup.matches} pagination={false} />
                    {sup.conclusion && <Alert style={{ marginTop: 10 }} type="info" showIcon message={sup.conclusion} />}
                  </div>

              </div>
            )}

            {/* ④ 执行时间与状态 */}

            {(plan && plan.search_sources && plan.search_sources.length) ? (

                ))}
              </div>
            ) : null}

            <SuppliersModal open={suppliersOpen} onClose={() => setSuppliersOpen(false)} />
          </Spin>
        );
      }

        const [projects, setProjects] = useState([]);

        const [plan, setPlan] = useState(null);
        const [loading, setLoading] = useState(false);
        const [busy, setBusy] = useState('');

        useEffect(() => {
          api('/api/projects')
            .then((d) => setProjects(Array.isArray(d) ? d : (d.projects || [])))
            .catch((e) => message.error('加载项目失败: ' + e.message));
        }, []);

        const loadPlan = (pid) => {
          if (!pid) { setPlan(null); return; }
          setLoading(true);
          api(`/api/projects/${pid}/cleaning`)
            .then((d) => setPlan(d.cleaning || emptyCleaningPlan(pid)))
            .catch((e) => message.error('加载清洗方案失败: ' + e.message))
            .finally(() => setLoading(false));
        };
        useEffect(() => { loadPlan(projectId); }, [projectId]);

        const onPickProject = (pid) => {
          setProjectId(pid);
          try { localStorage.setItem('techprocess:projectId', pid); } catch (e) {}
        };

        const pollTask = (pid, taskId) => new Promise((resolve, reject) => {
          const tick = () => api(`/api/projects/${pid}/tasks/${taskId}`).then((rec) => {
            if (rec.status === 'succeeded') resolve(rec.result);
            else if (rec.status === 'failed') reject(new Error(rec.error || '任务失败'));
            else setTimeout(tick, 1500);
          }).catch(reject);
          tick();

          if (!projectId) return;

          api(`/api/projects/${projectId}/cleaning/recommend`, { method: 'POST' })

            .then((result) => { setPlan(result.cleaning); message.success('AI 方案生成完成'); })
            .catch((e) => message.error('生成失败: ' + e.message))

              <Form.Item name="type" rules={[{ required: true, message: '类型' }]}><Input placeholder="类型(如 烧结炉)" /></Form.Item>
              <Form.Item name="owner"><Select style={{ width: 90 }} options={[{ value: '自有' }, { value: '外协' }]} /></Form.Item>
              <Form.Item name="vendor"><Input placeholder="外协厂商" /></Form.Item>
              <Form.Item name="capability"><Input placeholder="关键能力" /></Form.Item>
              <Form.Item name="capacity"><Input placeholder="产能" /></Form.Item>
              <Form.Item name="cost"><Input placeholder="外协费用" /></Form.Item>
              <Form.Item><Button type="primary" onClick={add}>保存</Button></Form.Item>
            </Form>
          </Modal>
        );
      }

      // ===================== 产线匹配与产能评估(真实接口) =====================
      function emptyProductionPlan(pid) {
        return {
          project_id: pid, requirements: [],
          inhouse: { matches: [], confirmed: false },
          outsourcing: { plans: [], confirmed: false },
          capacity_summary: null, conclusion: null,
          timing: { status: 'not_started', completed: false }, search_sources: [],
        };
      }

      function ProductionStep() {
        const [projects, setProjects] = useState([]);
        const [projectId, setProjectId] = useState(() => {
          try { return localStorage.getItem('techprocess:projectId') || ''; } catch (e) { return ''; }
        });
        const [plan, setPlan] = useState(null);
        const [loading, setLoading] = useState(false);
        const [busy, setBusy] = useState('');
        const [equipOpen, setEquipOpen] = useState(false);

        useEffect(() => {
          api('/api/projects')
            .then((d) => setProjects(Array.isArray(d) ? d : (d.projects || [])))
            .catch((e) => message.error('加载项目失败: ' + e.message));
        }, []);

        const loadPlan = (pid) => {
          if (!pid) { setPlan(null); return; }
          setLoading(true);
          api(`/api/projects/${pid}/production`)
            .then((d) => setPlan(d.production || emptyProductionPlan(pid)))
            .catch((e) => message.error('加载评估失败: ' + e.message))
            .finally(() => setLoading(false));
        };
        useEffect(() => { loadPlan(projectId); }, [projectId]);

        const onPickProject = (pid) => {
          setProjectId(pid);
          try { localStorage.setItem('techprocess:projectId', pid); } catch (e) {}
        };

        const pollTask = (pid, taskId) => new Promise((resolve, reject) => {
          const tick = () => api(`/api/projects/${pid}/tasks/${taskId}`).then((rec) => {
            if (rec.status === 'succeeded') resolve(rec.result);
            else if (rec.status === 'failed') reject(new Error(rec.error || '任务失败'));
            else setTimeout(tick, 1500);
          }).catch(reject);
          tick();
        });

        const doRecommend = () => {
          if (!projectId) return;
          setBusy('recommend');
          api(`/api/projects/${projectId}/production/recommend`, { method: 'POST' })
            .then((d) => pollTask(projectId, d.task_id))
            .then((result) => { setPlan(result.production); message.success('AI 评估完成'); })
            .catch((e) => message.error('评估失败: ' + e.message))
            .finally(() => setBusy(''));
        };

        const confirmSection = (section) => api(`/api/projects/${projectId}/production/confirm?section=${section}`, { method: 'POST' })
          .then((d) => { setPlan(d.production); message.success('已确认'); })
          .catch((e) => message.error(e.message));

        const setTiming = (action) => api(`/api/projects/${projectId}/production/timing?action=${action}`, { method: 'POST' })
          .then((d) => { setPlan(d.production); }).catch((e) => message.error(e.message));

        const projOptions = projects.map((p) => ({
          value: p.project_id,
          label: `${p.device_name || p.source_filename || p.project_id}(${p.project_id})`,
        }));

        if (!projectId) {
          return (
            <div style={{ padding: '8px 0' }}>
              <Space wrap style={{ marginBottom: 16 }}>
                <span>关联图纸项目:</span>
                <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                  placeholder="选择「图纸解析」步骤产生的项目"
                  value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              </Space>
              <Alert type="info" showIcon message="请先选择一个图纸项目"
                description="产线匹配依据第 4 步制造工艺与设备台账评估。先在前序步骤生成项目与工艺,再回到这里。" />
            </div>
          );
        }

        const reqs = (plan && plan.requirements) || [];
        const inh = (plan && plan.inhouse) || {};
        const out = (plan && plan.outsourcing) || {};
        const tm = (plan && plan.timing) || {};

        const card = (title, extra, children) => (
          <div style={{ border: '1px solid #eceff2', borderRadius: 6, padding: '14px 18px', marginBottom: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 12 }}>
              <div style={{ fontWeight: 600, fontSize: 15 }}>{title}</div>
              <div style={{ marginLeft: 'auto' }}>{extra}</div>
            </div>
            {children}
          </div>
        );

        const reqCols = [
          { title: '工序', dataIndex: 'process', width: 130 },
          { title: '设备类型', dataIndex: 'equipment_type', width: 110 },
          { title: '关键要求', dataIndex: 'key_requirement' },
          { title: '数量/节拍', dataIndex: 'qty', width: 100 },
        ];
        const inhCols = [
          { title: '设备类型', dataIndex: 'equipment_type', width: 110 },
          { title: '要求', dataIndex: 'requirement' },
          { title: '匹配自有设备', dataIndex: 'matched_equipment' },
          { title: '满足', dataIndex: 'satisfied', width: 80,
            render: (q) => <Tag color={q ? 'success' : 'error'}>{q ? '满足' : '不满足'}</Tag> },
          { title: '产能', dataIndex: 'capacity', width: 100 },
          { title: '差距/说明', dataIndex: 'gap_notes' },
        ];
        const outCols = [
          { title: '设备类型', dataIndex: 'equipment_type', width: 110 },
          { title: '外协厂商', dataIndex: 'vendor' },
          { title: '设备', dataIndex: 'equipment' },
          { title: '满足', dataIndex: 'satisfied', width: 70,
            render: (q) => <Tag color={q ? 'success' : 'default'}>{q ? '满足' : '否'}</Tag> },
          { title: '成本', dataIndex: 'cost', width: 90 },
          { title: '交期', dataIndex: 'lead_time', width: 90 },
          { title: '建议外协', dataIndex: 'recommend', width: 90,
            render: (r) => <Tag color={r ? 'orange' : 'default'}>{r ? '建议' : '暂不'}</Tag> },
          { title: '理由', dataIndex: 'reason' },
        ];

        const dur = (() => {
          if (!tm.started_at || !tm.finished_at) return null;
          const s = Date.parse(tm.started_at.replace(/-/g, '/'));
          const f = Date.parse(tm.finished_at.replace(/-/g, '/'));
          if (isNaN(s) || isNaN(f)) return null;
          return Math.max(0, Math.round((f - s) / 60000)) + ' 分钟';
        })();

        return (
          <Spin spinning={loading}>
            <Space wrap style={{ marginBottom: 16 }}>
              <span>关联图纸项目:</span>
              <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                placeholder="选择「图纸解析」步骤产生的项目"
                value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              <Button icon={<RobotOutlined />} loading={busy === 'recommend'} onClick={doRecommend}>AI 评估</Button>
              <Button onClick={() => setEquipOpen(true)}>维护设备台账</Button>
            </Space>

            {/* 设备需求 */}
            {card('设备需求(源自制造工艺工序)', null,
              reqs.length ? (
                <Table size="small" rowKey={(r, i) => 'rq' + i} columns={reqCols} dataSource={reqs} pagination={false} />
              ) : <Empty description="点「AI 评估」从工艺路径推导设备需求" image={Empty.PRESENTED_IMAGE_SIMPLE} />
            )}

            {/* ① 自有产线匹配 */}
            {card('① 自有产线设备匹配(是否满足图纸要求)',
              <Space>
                {inh.confirmed && <Tag color="success"><CheckCircleOutlined /> 已确认 {inh.confirmed_at}</Tag>}
                <Button type="primary" size="small" disabled={!(inh.matches && inh.matches.length)}
                  onClick={() => confirmSection('inhouse')}>确认产线匹配</Button>
              </Space>,
              (inh.matches && inh.matches.length) ? (
                <Table size="small" rowKey={(r, i) => 'ih' + i} columns={inhCols} dataSource={inh.matches} pagination={false} />
              ) : <Empty description="待 AI 评估" image={Empty.PRESENTED_IMAGE_SIMPLE} />
            )}

            {/* ② 外协安排 */}
            {card('② 外协厂商资源匹配与安排(满足且成本合适则建议外协)',
              <Space>
                {out.confirmed && <Tag color="success"><CheckCircleOutlined /> 已确认 {out.confirmed_at}</Tag>}
                <Button type="primary" size="small" disabled={!(out.plans && out.plans.length)}
                  onClick={() => confirmSection('outsourcing')}>确认外协安排</Button>
              </Space>,
              (out.plans && out.plans.length) ? (
                <Table size="small" rowKey={(r, i) => 'os' + i} columns={outCols} dataSource={out.plans} pagination={false} />
              ) : <Empty description="自有不满足项会在此给出外协建议" image={Empty.PRESENTED_IMAGE_SIMPLE} />
            )}

            {(plan && (plan.capacity_summary || plan.conclusion)) && (
              <div style={{ marginBottom: 16 }}>
                {plan.capacity_summary && <Alert style={{ marginBottom: 8 }} type="info" showIcon message={'产能评估:' + plan.capacity_summary} />}
                {plan.conclusion && <Alert type="success" showIcon message={'结论:' + plan.conclusion} />}
              </div>
            )}

            {/* ③ 执行时间与状态 */}
            {card('③ 执行时间与完成状态',
              <Tag color={tm.status === 'done' ? 'success' : tm.status === 'in_progress' ? 'processing' : 'default'}>
                {tm.status === 'done' ? '已完成' : tm.status === 'in_progress' ? '进行中' : '未开始'}
              </Tag>,
              <div>
                <Descriptions size="small" column={3} bordered>
                  <Descriptions.Item label="开始时间">{tm.started_at || '—'}</Descriptions.Item>
                  <Descriptions.Item label="完成时间">{tm.finished_at || '—'}</Descriptions.Item>
                  <Descriptions.Item label="用时">{dur || '—'}</Descriptions.Item>
                </Descriptions>
                <Space style={{ marginTop: 12 }}>
                  <Button onClick={() => setTiming('start')} disabled={tm.status === 'in_progress'}>开始</Button>
                  <Button type="primary" onClick={() => setTiming('finish')} disabled={tm.completed}>标记完成</Button>
                </Space>
              </div>
            )}

            {(plan && plan.search_sources && plan.search_sources.length) ? (
              <div style={{ color: '#8a9099', fontSize: 12 }}>
                检索来源:{plan.search_sources.map((s, i) => (
                  <a key={i} href={s.url} target="_blank" rel="noopener noreferrer" style={{ marginRight: 10 }}>{s.title}↗</a>
                ))}
              </div>
            ) : null}

            <EquipmentModal open={equipOpen} onClose={() => setEquipOpen(false)} />
          </Spin>
        );
      }

      // ===================== 通用步骤编辑器(JSON,直接回写各步接口) =====================
      function StepEditorModal({ projectId, stepKey, title, open, onClose, onSaved }) {
        const [text, setText] = useState('');
        const [loading, setLoading] = useState(false);
        useEffect(() => {
          if (!open || !projectId) return;
          setLoading(true);
          api(`/api/projects/${projectId}/${stepKey}`)
            .then((d) => setText(JSON.stringify(d[stepKey] || {}, null, 2)))
            .catch((e) => message.error(e.message))
            .finally(() => setLoading(false));
        }, [open, projectId, stepKey]);

        const save = () => {
          let obj;
          try { obj = JSON.parse(text); } catch (e) { message.error('JSON 格式错误: ' + e.message); return; }
          api(`/api/projects/${projectId}/${stepKey}`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj),
          }).then(() => { message.success('已保存'); onClose(); onSaved && onSaved(); })
            .catch((e) => message.error('保存失败: ' + e.message));
        };

        return (
          <Modal title={`编辑:${title}`} open={open} onCancel={onClose} onOk={save} okText="保存" width={820}>
            <Spin spinning={loading}>
              <Alert type="warning" showIcon style={{ marginBottom: 8 }}
                message="直接编辑该步骤的结构化数据(JSON),保存即回写。请保持字段结构合法。" />
              <Input.TextArea value={text} onChange={(e) => setText(e.target.value)}
                autoSize={{ minRows: 16, maxRows: 28 }} style={{ fontFamily: 'monospace', fontSize: 12 }} />
            </Spin>
          </Modal>
        );
      }

      // ===================== 技术工艺总结(汇总 + 可编辑 + 导出) =====================
      const SUMMARY_STEPS = [
        { key: 'material', title: '材料定性与供应链拆解' },
        { key: 'manufacturing', title: '制造工艺路径规划和BOM编制' },
        { key: 'cleaning', title: '清洗与洁净度管控方案制定' },
        { key: 'assembly', title: '组装与检测方案制定' },
        { key: 'production', title: '产线匹配与产能评估' },
      ];

      function SummaryStep() {
        const [projects, setProjects] = useState([]);
        const [projectId, setProjectId] = useState(() => {
          try { return localStorage.getItem('techprocess:projectId') || ''; } catch (e) { return ''; }
        });
        const [agg, setAgg] = useState(null);
        const [sum, setSum] = useState({});
        const [loading, setLoading] = useState(false);
        const [busy, setBusy] = useState('');
        const [editor, setEditor] = useState(null); // {key,title}

        useEffect(() => {
          api('/api/projects')
            .then((d) => setProjects(Array.isArray(d) ? d : (d.projects || [])))
            .catch((e) => message.error('加载项目失败: ' + e.message));
        }, []);

        const load = (pid) => {
          if (!pid) { setAgg(null); return; }
          setLoading(true);
          api(`/api/projects/${pid}/summary`)
            .then((d) => { setAgg(d); setSum(d.summary || {}); })
            .catch((e) => message.error('加载汇总失败: ' + e.message))
            .finally(() => setLoading(false));
        };
        useEffect(() => { load(projectId); }, [projectId]);

        const onPickProject = (pid) => {
          setProjectId(pid);
          try { localStorage.setItem('techprocess:projectId', pid); } catch (e) {}
        };

        const pollTask = (pid, taskId) => new Promise((resolve, reject) => {
          const tick = () => api(`/api/projects/${pid}/tasks/${taskId}`).then((rec) => {
            if (rec.status === 'succeeded') resolve(rec.result);
            else if (rec.status === 'failed') reject(new Error(rec.error || '任务失败'));
            else setTimeout(tick, 1500);
          }).catch(reject);
          tick();
        });

        const aiSummary = () => {
          setBusy('ai');
          api(`/api/projects/${projectId}/summary/recommend`, { method: 'POST' })
            .then((d) => pollTask(projectId, d.task_id))
            .then((r) => { setSum(r.summary); message.success('AI 摘要生成完成'); })
            .catch((e) => message.error('生成失败: ' + e.message))
            .finally(() => setBusy(''));
        };

        const saveSummary = () => api(`/api/projects/${projectId}/summary`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sum),
        }).then((d) => { setSum(d.summary); message.success('已保存'); }).catch((e) => message.error(e.message));

        const confirmSummary = () => api(`/api/projects/${projectId}/summary/confirm`, { method: 'POST' })
          .then((d) => { setSum(d.summary); message.success('已定稿'); }).catch((e) => message.error(e.message));

        const projOptions = projects.map((p) => ({
          value: p.project_id,
          label: `${p.device_name || p.source_filename || p.project_id}(${p.project_id})`,
        }));

        if (!projectId) {
          return (
            <div style={{ padding: '8px 0' }}>
              <Space wrap style={{ marginBottom: 16 }}>
                <span>关联图纸项目:</span>
                <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                  placeholder="选择「图纸解析」步骤产生的项目"
                  value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              </Space>
              <Alert type="info" showIcon message="请先选择一个图纸项目"
                description="技术工艺总结会汇总该项目前面各步的结果。" />
            </div>
          );
        }

        const card = (title, extra, children) => (
          <div style={{ border: '1px solid #eceff2', borderRadius: 6, padding: '14px 18px', marginBottom: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 12 }}>
              <div style={{ fontWeight: 600, fontSize: 15 }}>{title}</div>
              <div style={{ marginLeft: 'auto' }}>{extra}</div>
            </div>
            {children}
          </div>
        );

        const lines = (v) => (Array.isArray(v) ? v.join('\n') : (v || ''));
        const toArr = (s) => (s || '').split('\n').map((x) => x.trim()).filter(Boolean);
        const steps = (agg && agg.steps) || {};

        return (
          <Spin spinning={loading}>
            <Space wrap style={{ marginBottom: 16 }}>
              <span>关联图纸项目:</span>
              <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                placeholder="选择「图纸解析」步骤产生的项目"
                value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              <Button icon={<RobotOutlined />} loading={busy === 'ai'} onClick={aiSummary}>AI 生成摘要</Button>
              <Button onClick={() => window.open(resourceUrl(`/api/projects/${projectId}/summary.html`), '_blank')}>导出文档(HTML/打印PDF)</Button>
              <Button onClick={() => window.open(resourceUrl(`/api/projects/${projectId}/summary.md`), '_blank')}>导出 Markdown</Button>
            </Space>

            {/* 执行摘要(可编辑) */}
            {card('执行摘要(可编辑)',
              <Space>
                {sum.confirmed && <Tag color="success"><CheckCircleOutlined /> 已定稿 {sum.confirmed_at}</Tag>}
                <Button size="small" onClick={saveSummary}>保存</Button>
                <Button type="primary" size="small" onClick={confirmSummary}>定稿</Button>
              </Space>,
              <div>
                <div style={{ marginBottom: 8 }}>标题
                  <Input value={sum.title || ''} onChange={(e) => setSum({ ...sum, title: e.target.value })}
                    placeholder="技术工艺总结报告" style={{ marginTop: 4 }} /></div>
                <div style={{ marginBottom: 8 }}>总体概述
                  <Input.TextArea value={sum.overview || ''} onChange={(e) => setSum({ ...sum, overview: e.target.value })}
                    autoSize={{ minRows: 2 }} style={{ marginTop: 4 }} /></div>
                <Row gutter={16}>
                  <Col span={12}>关键亮点(每行一条)
                    <Input.TextArea value={lines(sum.highlights)} onChange={(e) => setSum({ ...sum, highlights: toArr(e.target.value) })}
                      autoSize={{ minRows: 3 }} style={{ marginTop: 4 }} /></Col>
                  <Col span={12}>风险与待办(每行一条)
                    <Input.TextArea value={lines(sum.risks)} onChange={(e) => setSum({ ...sum, risks: toArr(e.target.value) })}
                      autoSize={{ minRows: 3 }} style={{ marginTop: 4 }} /></Col>
                </Row>
                <div style={{ marginTop: 8 }}>结论
                  <Input.TextArea value={sum.conclusion || ''} onChange={(e) => setSum({ ...sum, conclusion: e.target.value })}
                    autoSize={{ minRows: 2 }} style={{ marginTop: 4 }} /></div>
              </div>
            )}

            {/* 各步骤汇总 + 编辑入口 */}
            {card('各步骤结果(可在此修改)', null,
              <Table size="small" rowKey="key" pagination={false}
                columns={[
                  { title: '步骤', dataIndex: 'title' },
                  { title: '状态', dataIndex: 'key', width: 120, render: (k) => {
                    const doc = steps[k] || {};
                    const filled = Object.keys(doc).length > 0;
                    const done = (doc.timing || {}).completed;
                    return <Tag color={done ? 'success' : filled ? 'processing' : 'default'}>{done ? '已完成' : filled ? '已填写' : '未开始'}</Tag>;
                  } },
                  { title: '操作', width: 90, render: (_, r) => (
                    <a onClick={() => setEditor({ key: r.key, title: r.title })}>编辑</a>) },
                ]}
                dataSource={SUMMARY_STEPS} />
            )}

            <div style={{ color: '#8a9099', fontSize: 12 }}>
              提示:「编辑」可直接修改对应步骤的结构化数据;导出文档会包含所有步骤的完整内容。
            </div>

            {editor && (
              <StepEditorModal projectId={projectId} stepKey={editor.key} title={editor.title}
                open={!!editor} onClose={() => setEditor(null)} onSaved={() => load(projectId)} />
            )}

            <Divider />
            <div className="tp-section-title">最终确认并录入</div>
            <EndStep initialProjectId={projectId} />
          </Spin>
        );
      }

      // ===================== 最终确认并录入到管理列表（技术总结末尾 / 报价流程结束页复用） =====================
      function EndStep({ initialProjectId = '' }) {
        const [projects, setProjects] = useState([]);
        const [projectId, setProjectId] = useState(() => {
          if (initialProjectId) return initialProjectId;
          try { return localStorage.getItem('techprocess:projectId') || ''; } catch (e) { return ''; }
        });
        const [name, setName] = useState('');
        const [record, setRecord] = useState(null);
        const [busy, setBusy] = useState(false);

        useEffect(() => {
          api('/api/projects')
            .then((d) => setProjects(Array.isArray(d) ? d : (d.projects || [])))
            .catch((e) => message.error('加载项目失败: ' + e.message));
        }, []);

        useEffect(() => { if (initialProjectId) setProjectId(initialProjectId); }, [initialProjectId]);

        // 选定项目后:带出器件名作为默认名称,并查已有录入记录
        useEffect(() => {
          if (!projectId) return;
          const proj = projects.find((p) => p.project_id === projectId);
          if (proj && !name) setName(proj.device_name || proj.source_filename || '');
          api(`/api/techprocess/records?biz=${BIZ}`).then((d) => {
            const r = (d.records || []).find((x) => x.project_id === projectId);
            if (r) { setRecord(r); if (!name) setName(r.name || ''); }
          }).catch(() => {});
        }, [projectId, projects]);

        const onPickProject = (pid) => {
          setProjectId(pid); setRecord(null); setName('');
          try { localStorage.setItem('techprocess:projectId', pid); } catch (e) {}
        };

        const register = () => {
          setBusy(true);
          api('/api/techprocess/records', {

                {record ? (
                  <Alert type="success" showIcon style={{ marginBottom: 12 }}

                <Button type="primary" loading={busy} onClick={register} icon={<CheckCircleOutlined />}>

      // ===================== 成本测算(报价流程第 1 步,真实接口) =====================
      function emptyCostEstimate(pid) {
        return {
          project_id: pid, currency: 'CNY',
          material_costs: [], manufacturing_costs: [], technical_costs: [], logistics_costs: [], market_notes: null,
          totals: { material_total: 0, manufacturing_total: 0, technical_total: 0, logistics_total: 0, grand_total: 0, currency: 'CNY' },
          summary: null, confirmed: false, timing: { status: 'not_started', completed: false }, search_sources: [],
        };
      }

      function CostEstimateStep() {
        const [projects, setProjects] = useState([]);
        const [projectId, setProjectId] = useState(() => {
          try { return localStorage.getItem('techprocess:projectId') || ''; } catch (e) { return ''; }
        });
        const [doc, setDoc] = useState(null);
        const [loading, setLoading] = useState(false);
        const [busy, setBusy] = useState('');

        useEffect(() => {
          api('/api/projects')
            .then((d) => setProjects(Array.isArray(d) ? d : (d.projects || [])))
            .catch((e) => message.error('加载项目失败: ' + e.message));
        }, []);

        const loadDoc = (pid) => {
          if (!pid) { setDoc(null); return; }
          setLoading(true);
          api(`/api/projects/${pid}/costest`)
            .then((d) => setDoc(d.costest || emptyCostEstimate(pid)))
            .catch((e) => message.error('加载成本测算失败: ' + e.message))
            .finally(() => setLoading(false));
        };
        useEffect(() => { loadDoc(projectId); }, [projectId]);

        const onPickProject = (pid) => {
          setProjectId(pid);
          try { localStorage.setItem('techprocess:projectId', pid); } catch (e) {}
        };

        const pollTask = (pid, taskId) => new Promise((resolve, reject) => {
          const tick = () => api(`/api/projects/${pid}/tasks/${taskId}`).then((rec) => {
            if (rec.status === 'succeeded') resolve(rec.result);
            else if (rec.status === 'failed') reject(new Error(rec.error || '任务失败'));
            else setTimeout(tick, 1500);
          }).catch(reject);
          tick();
        });

        const doRecommend = () => {
          if (!projectId) return;
          setBusy('recommend');
          api(`/api/projects/${projectId}/costest/recommend`, { method: 'POST' })
            .then((d) => pollTask(projectId, d.task_id))
            .then((r) => { setDoc(r.costest); message.success('AI 成本测算完成'); })
            .catch((e) => message.error('测算失败: ' + e.message))
            .finally(() => setBusy(''));
        };

        const confirm = () => api(`/api/projects/${projectId}/costest/confirm`, { method: 'POST' })
          .then((d) => { setDoc(d.costest); message.success('已定稿'); }).catch((e) => message.error(e.message));

        const setTiming = (action) => api(`/api/projects/${projectId}/costest/timing?action=${action}`, { method: 'POST' })
          .then((d) => { setDoc(d.costest); }).catch((e) => message.error(e.message));

        const projOptions = projects.map((p) => ({
          value: p.project_id,
          label: `${p.device_name || p.source_filename || p.project_id}(${p.project_id})`,
        }));

        if (!projectId) {
          return (
            <div style={{ padding: '8px 0' }}>
              <Space wrap style={{ marginBottom: 16 }}>
                <span>关联图纸项目:</span>
                <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                  placeholder="选择图纸项目(关联其材料/制造工艺与 BOM)"
                  value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              </Space>
              <Alert type="info" showIcon message="请先选择一个图纸项目"
                description="成本测算依托该项目的材料计划与制造工艺(工序+BOM)。建议先完成相应技术工艺步骤。" />
            </div>
          );
        }

        const d = doc || {};
        const tm = d.timing || {};

        // 可编辑：直接改本地 doc（不改 = AI 原样；改了点「保存修改」回写后端并重算合计）
        const upd = (field, idx, key, val) => {
          const rows = (d[field] || []).slice();
          rows[idx] = { ...rows[idx], [key]: val };
          setDoc({ ...d, [field]: rows });
        };
        const addRow = (field) => setDoc({ ...d, [field]: [...(d[field] || []), {}] });
        const delRow = (field, idx) => { const rows = (d[field] || []).slice(); rows.splice(idx, 1); setDoc({ ...d, [field]: rows }); };
        const save = () => api(`/api/projects/${projectId}/costest`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d),
        }).then((r) => { setDoc(r.costest || d); message.success('已保存修改'); })
          .catch((e) => message.error('保存失败: ' + e.message));

        // 生成一个可编辑单元格列（num=数字输入）
        const eCol = (title, field, key, opts) => ({
          title, dataIndex: key, width: (opts && opts.width),
          render: (_, row, i) => (opts && opts.num)
            ? <InputNumber size="small" style={{ width: '100%' }} value={row[key]} onChange={(v) => upd(field, i, key, v)} />
            : <Input size="small" value={row[key]} onChange={(e) => upd(field, i, key, e.target.value)} />,
        });
        const delCol = (field) => ({ title: '', width: 44, render: (_, r, i) => (
          <a style={{ color: '#c2410c' }} onClick={() => delRow(field, i)}>删</a>) });
        const addBtn = (field) => (<a onClick={() => addRow(field)}><PlusOutlined /> 新增一行</a>);

        // 前端实时合计（编辑即更新；保存后后端会重算并回填）
        const nf = (v) => (typeof v === 'number' ? v : (parseFloat(v) || 0));
        const lt = { material: 0, manufacturing: 0, technical: 0, logistics: 0 };
        (d.material_costs || []).forEach((it) => { lt.material += (typeof it.amount === 'number' ? it.amount : nf(it.unit_usage) * nf(it.unit_price)); });
        (d.manufacturing_costs || []).forEach((it) => { lt.manufacturing += (typeof it.subtotal === 'number' ? it.subtotal : nf(it.labor_cost) + nf(it.equipment_depreciation) + nf(it.energy_cost) + nf(it.other)); });
        (d.technical_costs || []).forEach((it) => { lt.technical += nf(it.amount); });
        (d.logistics_costs || []).forEach((it) => { lt.logistics += nf(it.amount); });
        lt.grand = lt.material + lt.manufacturing + lt.technical + lt.logistics;

        const card = (title, extra, children) => (
          <div style={{ border: '1px solid #eceff2', borderRadius: 6, padding: '14px 18px', marginBottom: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 12 }}>
              <div style={{ fontWeight: 600, fontSize: 15 }}>{title}</div>
              <div style={{ marginLeft: 'auto' }}>{extra}</div>
            </div>
            {children}
          </div>
        );

        const matCols = [
          eCol('原材料', 'material_costs', 'item'),
          eCol('规格', 'material_costs', 'spec', { width: 110 }),
          eCol('用量', 'material_costs', 'unit_usage', { num: true, width: 80 }),
          eCol('单位', 'material_costs', 'unit', { width: 70 }),
          eCol('单价(元)', 'material_costs', 'unit_price', { num: true, width: 90 }),
          eCol('金额(元)', 'material_costs', 'amount', { num: true, width: 90 }),
          eCol('市场价来源', 'material_costs', 'market_price_source'),
          eCol('供应稳定性', 'material_costs', 'supply_stability', { width: 100 }),
          delCol('material_costs'),
        ];
        const manCols = [
          eCol('工序', 'manufacturing_costs', 'process'),
          eCol('人工', 'manufacturing_costs', 'labor_cost', { num: true, width: 80 }),
          eCol('设备折旧', 'manufacturing_costs', 'equipment_depreciation', { num: true, width: 90 }),
          eCol('能耗', 'manufacturing_costs', 'energy_cost', { num: true, width: 80 }),
          eCol('其它', 'manufacturing_costs', 'other', { num: true, width: 80 }),
          eCol('小计(元)', 'manufacturing_costs', 'subtotal', { num: true, width: 90 }),
          eCol('依据', 'manufacturing_costs', 'basis'),
          delCol('manufacturing_costs'),
        ];
        const techCols = [
          eCol('项目', 'technical_costs', 'item'),
          eCol('分摊依据', 'technical_costs', 'basis'),
          eCol('金额(元)', 'technical_costs', 'amount', { num: true, width: 90 }),
          eCol('备注', 'technical_costs', 'note'),
          delCol('technical_costs'),
        ];
        const logiCols = [
          eCol('项目', 'logistics_costs', 'item'),
          eCol('计算依据', 'logistics_costs', 'basis'),
          eCol('金额(元)', 'logistics_costs', 'amount', { num: true, width: 90 }),
          eCol('备注', 'logistics_costs', 'note'),
          delCol('logistics_costs'),
        ];

        const dur = (() => {
          if (!tm.started_at || !tm.finished_at) return null;
          const s = Date.parse(tm.started_at.replace(/-/g, '/'));
          const f = Date.parse(tm.finished_at.replace(/-/g, '/'));
          if (isNaN(s) || isNaN(f)) return null;
          return Math.max(0, Math.round((f - s) / 60000)) + ' 分钟';
        })();

        return (
          <Spin spinning={loading}>
            <Space wrap style={{ marginBottom: 16 }}>
              <span>关联图纸项目:</span>
              <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                placeholder="选择图纸项目(关联其材料/制造工艺与 BOM)"
                value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              <Button icon={<RobotOutlined />} loading={busy === 'recommend'} onClick={doRecommend}>AI 成本测算</Button>
              <Button type="primary" ghost onClick={save}>保存修改</Button>
              <Button onClick={() => window.open(resourceUrl(`/api/projects/${projectId}/costest.csv`), '_blank')}>导出 CSV</Button>
              {d.confirmed && <Tag color="success"><CheckCircleOutlined /> 已定稿 {d.confirmed_at}</Tag>}
              <Button type="primary"
                disabled={!((d.material_costs && d.material_costs.length) || (d.manufacturing_costs && d.manufacturing_costs.length))}
                onClick={confirm}>定稿</Button>
            </Space>
            <Alert type="info" showIcon style={{ marginBottom: 12 }}
              message="表格与文字均可直接修改以矫正 AI 结果：改动后点「保存修改」回写并重算合计。" />

            {/* 合计（前端实时） */}
            <div style={{ display: 'flex', gap: 12, marginBottom: 16, flexWrap: 'wrap' }}>
              {[['材料成本', lt.material], ['制造成本', lt.manufacturing], ['技术附加', lt.technical],
                ['物流仓储', lt.logistics], ['单件总成本', lt.grand]].map(([label, val], i, arr) => {
                const hl = i === arr.length - 1;
                return (
                  <div key={i} style={{ flex: 1, minWidth: 130, border: '1px solid #eceff2', borderRadius: 6, padding: '12px 16px',
                    background: hl ? '#e6f4ff' : '#fff' }}>
                    <div style={{ color: '#646a73', fontSize: 13 }}>{label}</div>
                    <div style={{ fontSize: 22, fontWeight: 700, color: hl ? '#1677ff' : '#1f2329' }}>
                      ¥{(val || 0).toFixed ? (val || 0).toFixed(2) : (val || 0)}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* ① 材料成本 */}
            {card('① 材料成本(核心原材料单位用量成本)', addBtn('material_costs'),
              <Table size="small" rowKey={(r, i) => 'm' + i} columns={matCols} dataSource={d.material_costs || []} pagination={false}
                locale={{ emptyText: '点「AI 成本测算」生成，或「新增一行」手工录入' }} scroll={{ x: 'max-content' }} />
            )}

            {/* ② 制造成本 */}
            {card('② 制造成本(按工序:人工/设备折旧/能耗)', addBtn('manufacturing_costs'),
              <Table size="small" rowKey={(r, i) => 'p' + i} columns={manCols} dataSource={d.manufacturing_costs || []} pagination={false}
                locale={{ emptyText: '待 AI 测算，或「新增一行」手工录入' }} scroll={{ x: 'max-content' }} />
            )}

            {/* ③ 技术附加成本 */}
            {card('③ 技术附加成本(定制研发/客户验证/特殊检测分摊)', addBtn('technical_costs'),
              <Table size="small" rowKey={(r, i) => 't' + i} columns={techCols} dataSource={d.technical_costs || []} pagination={false}
                locale={{ emptyText: '待 AI 测算，或「新增一行」手工录入' }} scroll={{ x: 'max-content' }} />
            )}

            {/* ④ 物流仓储成本 */}
            {card('④ 物流仓储成本(运输/仓储/包装/装卸 分摊)', addBtn('logistics_costs'),
              <Table size="small" rowKey={(r, i) => 'l' + i} columns={logiCols} dataSource={d.logistics_costs || []} pagination={false}
                locale={{ emptyText: '待 AI 测算，或「新增一行」手工录入运输/仓储/包装等费用' }} scroll={{ x: 'max-content' }} />
            )}

            {/* ⑤ 市场价格与供应稳定性（可编辑） */}
            {card('⑤ 原材料市场价格与供应稳定性(采购视角)', null,
              <Input.TextArea value={d.market_notes || ''} rows={3}
                placeholder="待 AI 测算(联网检索行情)，也可直接在此补充/修改行情与供应说明"
                onChange={(e) => setDoc({ ...d, market_notes: e.target.value })} />
            )}

            {d.summary && <div style={{ color: '#646a73', margin: '4px 0 16px' }}>测算思路:{d.summary}</div>}

            {/* 执行时间与状态 */}
            {card('执行时间与完成状态',
              <Tag color={tm.status === 'done' ? 'success' : tm.status === 'in_progress' ? 'processing' : 'default'}>
                {tm.status === 'done' ? '已完成' : tm.status === 'in_progress' ? '进行中' : '未开始'}
              </Tag>,
              <div>
                <Descriptions size="small" column={3} bordered>
                  <Descriptions.Item label="开始时间">{tm.started_at || '—'}</Descriptions.Item>
                  <Descriptions.Item label="完成时间">{tm.finished_at || '—'}</Descriptions.Item>
                  <Descriptions.Item label="用时">{dur || '—'}</Descriptions.Item>
                </Descriptions>
                <Space style={{ marginTop: 12 }}>
                  <Button onClick={() => setTiming('start')} disabled={tm.status === 'in_progress'}>开始</Button>
                  <Button type="primary" onClick={() => setTiming('finish')} disabled={tm.completed}>标记完成</Button>
                </Space>
              </div>
            )}

            {(d.search_sources && d.search_sources.length) ? (
              <div style={{ color: '#8a9099', fontSize: 12 }}>
                检索来源:{d.search_sources.map((s, i) => (
                  <a key={i} href={s.url} target="_blank" rel="noopener noreferrer" style={{ marginRight: 10 }}>{s.title}↗</a>
                ))}
              </div>
            ) : null}
          </Spin>
        );
      }

      // ===================== 定价方案制定(报价流程第 2 步,真实接口) =====================
      function emptyPricing(pid) {
        return {
          project_id: pid, currency: 'CNY',
          costs: { material_cost: 0, production_cost: 0, management_rate: 10, management_cost: 0, base_cost: 0 },
          markup_rate: 20, base_price: 0, factors: [], factor_multiplier: 1,
          suggested_price: 0, final_price: null,
          approval: { status: 'draft' }, timing: { status: 'not_started', completed: false }, search_sources: [],
        };
      }

      function PricingStep() {
        const [projects, setProjects] = useState([]);
        const [projectId, setProjectId] = useState(() => {
          try { return localStorage.getItem('techprocess:projectId') || ''; } catch (e) { return ''; }
        });
        const [doc, setDoc] = useState(null);
        const [loading, setLoading] = useState(false);
        const [busy, setBusy] = useState('');
        const [comment, setComment] = useState('');

        useEffect(() => {
          api('/api/projects')
            .then((d) => setProjects(Array.isArray(d) ? d : (d.projects || [])))
            .catch((e) => message.error('加载项目失败: ' + e.message));
        }, []);

        const loadDoc = (pid) => {
          if (!pid) { setDoc(null); return; }
          setLoading(true);
          api(`/api/projects/${pid}/pricing`)
            .then((d) => setDoc(d.pricing || emptyPricing(pid)))
            .catch((e) => message.error('加载定价失败: ' + e.message))
            .finally(() => setLoading(false));
        };
        useEffect(() => { loadDoc(projectId); }, [projectId]);

        const onPickProject = (pid) => {
          setProjectId(pid);
          try { localStorage.setItem('techprocess:projectId', pid); } catch (e) {}
        };

        const pollTask = (pid, taskId) => new Promise((resolve, reject) => {
          const tick = () => api(`/api/projects/${pid}/tasks/${taskId}`).then((rec) => {
            if (rec.status === 'succeeded') resolve(rec.result);
            else if (rec.status === 'failed') reject(new Error(rec.error || '任务失败'));
            else setTimeout(tick, 1500);
          }).catch(reject);
          tick();
        });

        const doRecommend = () => {
          if (!projectId) return;
          setBusy('recommend');
          api(`/api/projects/${projectId}/pricing/recommend`, { method: 'POST' })
            .then((d) => pollTask(projectId, d.task_id))
            .then((r) => { setDoc(r.pricing); message.success('AI 定价建议完成'); })
            .catch((e) => message.error('生成失败: ' + e.message))
            .finally(() => setBusy(''));
        };

        const save = () => api(`/api/projects/${projectId}/pricing`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(doc),
        }).then((d) => { setDoc(d.pricing); message.success('已保存并重算'); }).catch((e) => message.error(e.message));

        const submit = () => api(`/api/projects/${projectId}/pricing/submit`, { method: 'POST' })
          .then((d) => { setDoc(d.pricing); message.success('已提交财务审核'); }).catch((e) => message.error(e.message));

        const review = (decision) => api(`/api/projects/${projectId}/pricing/review`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ decision, comment }),
        }).then((d) => { setDoc(d.pricing); message.success(decision === 'approve' ? '已通过' : '已驳回'); })
          .catch((e) => message.error(e.message));

        const setTiming = (action) => api(`/api/projects/${projectId}/pricing/timing?action=${action}`, { method: 'POST' })
          .then((d) => { setDoc(d.pricing); }).catch((e) => message.error(e.message));

        const projOptions = projects.map((p) => ({
          value: p.project_id,
          label: `${p.device_name || p.source_filename || p.project_id}(${p.project_id})`,
        }));

        if (!projectId) {
          return (
            <div style={{ padding: '8px 0' }}>
              <Space wrap style={{ marginBottom: 16 }}>
                <span>关联图纸项目:</span>
                <Select showSearch optionFilterProp="label" style={{ width: 360 }}
                  placeholder="选择图纸项目(沿用其成本测算结果)"
                  value={projectId || undefined} options={projOptions} onChange={onPickProject} />
              </Space>
              <Alert type="info" showIcon message="请先选择一个图纸项目"
                description="定价基于该项目的成本测算结果。建议先完成「成本测算」步骤。" />
            </div>
          );
        }

        const d = doc || {};
        const costs = d.costs || {};
        const appr = d.approval || {};
        const tm = d.timing || {};
        const setCost = (k, v) => setDoc({ ...d, costs: { ...costs, [k]: v } });
        const setFactor = (i, v) => {
          const fs = (d.factors || []).map((f, idx) => idx === i ? { ...f, adjustment_pct: v } : f);
          setDoc({ ...d, factors: fs });
        };

        const card = (title, extra, children) => (
          <div style={{ border: '1px solid #eceff2', borderRadius: 6, padding: '14px 18px', marginBottom: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 12 }}>
              <div style={{ fontWeight: 600, fontSize: 15 }}>{title}</div>
              <div style={{ marginLeft: 'auto' }}>{extra}</div>
            </div>
            {children}
          </div>
        );

        const factorCols = [
          { title: '维度', dataIndex: 'factor', width: 160 },
          { title: '判断', dataIndex: 'assessment' },
          { title: '调整系数%', width: 120, render: (_, r, i) => (
            <InputNumber size="small" value={r.adjustment_pct} step={1}
              onChange={(v) => setFactor(i, v)} style={{ width: 90 }} />) },
          { title: '理由', dataIndex: 'rationale' },
        ];

        const statusTag = {
          draft: <Tag>草稿</Tag>, submitted: <Tag color="processing">待财务审核</Tag>,

              <Select showSearch optionFilterProp="label" style={{ width: 360 }}

              <Button icon={<RobotOutlined />} loading={busy === 'recommend'} onClick={doRecommend}>AI 定价建议</Button>
              <Button type="primary" onClick={save}>保存并重算</Button>

            {/* 成本加成 */}
            {card('① 成本加成基础(原材料 + 生产加工 + 管理)', null,
              <div>
                <Space wrap size="large">
                  <span>原材料成本: <b>¥{Number(costs.material_cost || 0).toFixed(2)}</b></span>
                  <span>生产加工成本: <b>¥{Number(costs.production_cost || 0).toFixed(2)}</b></span>
                  <span>管理费率(%):
                    <InputNumber size="small" value={costs.management_rate} min={0}
                      onChange={(v) => setCost('management_rate', v)} style={{ width: 80, marginLeft: 4 }} /></span>
                  <span>管理成本: <b>¥{Number(costs.management_cost || 0).toFixed(2)}</b></span>
                  <span>成本基数: <b>¥{Number(costs.base_cost || 0).toFixed(2)}</b></span>
                </Space>
                <div style={{ marginTop: 12 }}>
                  <span>成本加成率/利润率(%):
                    <InputNumber size="small" value={d.markup_rate} min={0}
                      onChange={(v) => setDoc({ ...d, markup_rate: v })} style={{ width: 90, marginLeft: 4 }} /></span>
                  <span style={{ marginLeft: 20 }}>→ 加成后基准价: <b>¥{Number(d.base_price || 0).toFixed(2)}</b></span>
                </div>
                <div style={{ color: '#8a9099', fontSize: 12, marginTop: 6 }}>
                  原材料/生产加工成本取自「成本测算」;改费率/加成率后点「保存并重算」。
                </div>
              </div>
            )}

            {/* 调整维度 */}
            {card('② 价格调整维度(订单规模/技术难度/客户战略价值/竞争态势/原材料价格联动)', null,
              (d.factors && d.factors.length) ? (
                <Table size="small" rowKey={(r, i) => 'f' + i} columns={factorCols} dataSource={d.factors} pagination={false} />
              ) : <Empty description="点「AI 定价建议」生成各维度调整" image={Empty.PRESENTED_IMAGE_SIMPLE} />

            {/* 定价结果 */}
            {card('③ 定价结果', null,

                  <div style={{ flex: 1, minWidth: 120, border: '1px solid #eceff2', borderRadius: 6, padding: '12px 16px' }}>
                    <div style={{ color: '#646a73', fontSize: 13 }}>综合调整系数</div>
                    <div style={{ fontSize: 22, fontWeight: 700 }}>×{Number(d.factor_multiplier || 1).toFixed(3)}</div>
                  </div>
                  {priceBox('建议单价', d.suggested_price)}
                  {priceBox('最终报价', d.final_price, true)}
                </div>
                <span>最终报价(可覆盖):
                  <InputNumber value={d.final_price} min={0} step={0.01} style={{ width: 140, marginLeft: 8 }}
                    onChange={(v) => setDoc({ ...d, final_price: v })} /></span>
                {d.summary && <div style={{ color: '#646a73', marginTop: 10 }}>定价思路:{d.summary}</div>}
              </div>
            )}

            {/* 审批流 */}
            {card('④ 审核确认(销售测算 → 财务审核)', statusTag,
              <div>
                <Descriptions size="small" column={2} bordered>
                  <Descriptions.Item label="销售提交">{appr.sales_by ? `${appr.sales_by} ${appr.sales_at}` : '—'}</Descriptions.Item>
                  <Descriptions.Item label="财务审核">{appr.finance_by ? `${appr.finance_by} ${appr.finance_at}` : '—'}</Descriptions.Item>
                  <Descriptions.Item label="财务意见" span={2}>{appr.finance_comment || '—'}</Descriptions.Item>
                </Descriptions>
                <div style={{ marginTop: 12 }}>
                  {(appr.status === 'submitted') ? (
                    <Space>
                      <Input placeholder="财务审核意见(可选)" value={comment}
                        onChange={(e) => setComment(e.target.value)} style={{ width: 280 }} />
                      <Button type="primary" onClick={() => review('approve')}>通过</Button>
                      <Popconfirm title="确认驳回该定价方案?" onConfirm={() => review('reject')}>
                        <Button danger>驳回</Button>

            {/* 时间状态 */}
            {card('执行时间与完成状态',
              <Tag color={tm.status === 'done' ? 'success' : tm.status === 'in_progress' ? 'processing' : 'default'}>
                {tm.status === 'done' ? '已完成' : tm.status === 'in_progress' ? '进行中' : '未开始'}
              </Tag>,
              <Space>
                <Button onClick={() => setTiming('start')} disabled={tm.status === 'in_progress'}>开始</Button>
                <Button type="primary" onClick={() => setTiming('finish')} disabled={tm.completed}>标记完成</Button>
              </Space>
            )}

            {(d.search_sources && d.search_sources.length) ? (
              <div style={{ color: '#8a9099', fontSize: 12, marginTop: 8 }}>
                检索来源:{d.search_sources.map((s, i) => (

          </Spin>
